x_obj_bajo_equilibrio: >-
  ⛔ X_obj = {x_obj:.3f} kg/kg ms es inalcanzable con este aire: el producto se equilibra con
  el aire más seco que puede tener la cámara en **X_eq ≈ {x_eq:.3f} kg/kg ms** y no puede bajar de
  ahí, por largo que sea el horizonte. Subí el X_obj por encima de ese valor, o calentá o secá
  más el aire (colector, auxiliar).
