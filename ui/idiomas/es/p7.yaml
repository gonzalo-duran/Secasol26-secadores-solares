anual_prompt_detalle: Cálculo de un día representativo (contexto adicional)
anual_prompt_detalle_cap: >-
  Debajo aparece el cálculo de un único día (constantes o
  transitorio). Es útil para validar el motor o explorar
  transitorios — los resultados anuales que importan están
  arriba. Si no querés verlo, ignorá esta sección.
anual_sin_calcular: >-
  📅 **Modo ANUAL activado.** Para ver los resultados mensuales
  y agregados anuales, andá a **P4** y apretá el botón
  '📅 Calcular operación anual'. Mientras tanto se muestra el
  cálculo de un día representativo.
modo:
  titulo: Modo de cálculo
  label: ¿Cómo evaluamos el prediseño completo?
  transitorio: Transitorio (horizonte de P4)
  constantes: Constantes representativas
  help: |
    Transitorio: usa las forzantes horarias con las que corriste el motor termodinámico de cámara (P4), suma el auxiliar paso a paso y reporta resultados integrados sobre el horizonte.

    Constantes: condiciones representativas escalares — un punto de diseño único.
  sin_horizonte: >-
    ℹ️ Para activar el **modo transitorio** corré primero la cámara
    en P4 con forzantes 'Día sintético' o 'Día real'. El horizonte
    se va a propagar automáticamente acá.
horizonte:
  titulo: Horizonte propagado de cámara
  dias: "{n} día(s)"
  horizonte: Horizonte
  duracion: Duración
  forzantes: Forzantes
  caption: >-
    Las forzantes T_amb(t), T_sal_col(t), v_viento(t), I_g(t), ω(t)
    vienen de P4 exactamente como las simulaste. Si configuraste un
    **Auxiliar (P5)**, se aplica paso a paso a la T_ent de cámara
    antes de re-correr el motor termodinámico.
  boton: ▶ Calcular pipeline transitoria
  spinner: Corriendo auxiliar(t) + cámara TD + motor...
  prompt: ℹ️ Presioná **Calcular** para evaluar la pipeline transitoria.
condiciones:
  titulo: Condiciones de operación representativas
  caption: >-
    Ingresá las condiciones del día / momento de análisis.
