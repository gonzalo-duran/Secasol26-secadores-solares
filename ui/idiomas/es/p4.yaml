calibracion:
  titulo: "**🎯 Calibración del modelo de cámara**"
  intro: >-
    Barré un coeficiente de transporte y quedate con el valor que mejor ajusta la
    simulación al medido. El resultado es un diagnóstico: cuánto se aparta el
    modelo de lo medido y en qué dirección.
  parametro: Coeficiente a calibrar
  param:
    area_bandeja: Área efectiva de intercambio [m²]
    factor_K_m: Factor sobre K_m (transferencia de masa)
    factor_h_conv: Factor sobre h_conv (convección interior)
  ayuda_param: >-
    K_m gobierna la velocidad de evaporación; h_conv arrastra a K_m por
    Chilton-Colburn, así que además cambia el calor sensible.
  min: Mínimo
  max: Máximo
  n: N.º de puntos
  objetivo: Función objetivo
  obj:
    rmse: RMSE
    mbe_abs: "|MBE|"
    mae: MAE
  rango_invalido: El máximo debe ser mayor que el mínimo.
  correr: Calibrar
  spinner: Barriendo el coeficiente y ajustando contra el medido…
  sin_optimo: Ningún punto del barrido fue evaluable (revisá el rango o el solape temporal).
  grafica_titulo: Función objetivo vs coeficiente
  eje_x: Factor multiplicativo
  optimo: Óptimo
  resultado: "Óptimo: factor {valor} → RMSE {rmse}, MBE {mbe}, R² {r2}."
  lectura_alto: >-
    Un factor mayor que 1 significa que el modelo **subestima** el transporte:
    la cámara real seca más rápido de lo que predice.
  lectura_bajo: >-
    Un factor menor que 1 significa que el modelo **sobrestima** el transporte:
    la cámara real seca más lento de lo que predice.
  lectura_neutro: El modelo reproduce el ensayo sin corrección apreciable.
  aviso_hr: >-
    Ojo: la HR de entrada no se midió. Un error en la humedad de entrada se
    absorbe dentro de este factor, así que el valor calibrado puede estar
    compensando el supuesto y no un defecto del modelo.
  es_aplicable: "Este parámetro **es un campo del proyecto**: el valor óptimo se puede aplicar a la cámara."
  es_diagnostico: >-
    Este coeficiente es un **diagnóstico del modelo**, no una propiedad de la cámara: no se guarda en el proyecto, porque lo que absorbe (analogía de Chilton-Colburn, isoterma del cultivar, humedad de entrada supuesta) no transfiere a otro producto ni a otro caudal.
  lectura_area: >-
    El área efectiva de intercambio ajustada es **{veces}×** la de bandeja declarada. Para una capa de rodajas apiladas, un valor mayor que 1 es esperable.
  aplicar: "Aplicar el valor óptimo a la cámara"
  aplicado: "Valor óptimo aplicado a la cámara. Recalculá el secado arriba."
cadena:
  titulo: "**🔗 Diagnóstico de la cadena completa**"
  intro: >-
    Además de la cámara aislada, compará lo medido contra el resultado del sistema
    completo (colector → auxiliar → cámara) calculado en P7. No se puede calibrar
    sobre él: el residuo mezcla el error de todos los eslabones.
  sin_resultado: Calculá el transitorio en P7 para habilitar esta comparación.
  sin_ancla: >-
    El resultado de P7 no tiene fecha asociada (forzantes sintéticas). Corré el
    transitorio con clima real para poder alinearlo con lo medido.
  sin_solape: El período de lo medido no se solapa con el horizonte calculado en P7.
  grafica_titulo: "{magnitud} — medido vs cadena completa (P7)"
  simulado: Simulado (cadena P7)
  metricas: "Cadena completa: RMSE {rmse}, MBE {mbe}, R² {r2} sobre {n} pares."
  comparacion: >-
    Si la cadena ajusta peor que la cámara aislada, el exceso de error viene de los
    eslabones de aguas arriba (colector, caño, auxiliar) o del clima, no de la cámara.
