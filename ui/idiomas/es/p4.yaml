  intro: >-
    Contrastá la cámara simulada contra un ensayo propio. La cámara se corre
    AISLADA, forzada con el aire de entrada medido en el mismo archivo, para que
    el error del colector no se mezcle con el de la cámara.
  aviso_orden: >-
    💡 Conviene validar DESPUÉS de haber corrido el sistema completo en P7
    (Resultados): así ya tenés el prediseño cerrado y podés comparar también la
    cadena completa colector→cámara (sección "🔗 Diagnóstico" de abajo). Validar
    acá temprano y cortar el flujo deja el resto del sistema sin evaluar.
