  help_default: Caudal que debe mover el ventilador.
  metric: Caudal
perdidas:
  titulo: Pérdidas de carga del sistema
  modo:
    label: Ingreso de pérdidas de carga
    help: |
      **Por componentes:** estima ΔP_colector (Darcy-Weisbach) y ΔP_cámara (resistencia de bandejas) desde P3 y P4, más 20% de margen de ductos.

      **ΔP total directo:** ingresá el valor medido en campo o de catálogo.
    componentes: Por componentes (auto-estimado)
    total: ΔP total directo
  total:
    label: ΔP total del sistema [Pa]
    help: Incluye colector, cámara y ductos.
  colector:
    label: ΔP colector [Pa]
    help_auto: "Pérdida de carga en el banco de colectores (Darcy-Weisbach). Auto (P3): {v:.1f} Pa."
    help_sin: Pérdida de carga en el banco de colectores (Darcy-Weisbach). Configurar P3 para auto-estimación.
    auto_caption: "Auto P3: **{v:.1f} Pa**"
  camara:
    label: ΔP cámara [Pa]
    help_auto: "Pérdida de carga en las bandejas de la cámara. Auto (P4): {v:.1f} Pa (K_malla=2.0)."
    help_sin: Pérdida de carga en las bandejas de la cámara. Configurar P4 para auto-estimación.
    auto_caption: "Auto P4: **{v:.1f} Pa**"
  ductos:
    check: Especificar ΔP ductos
    label: ΔP ductos [Pa]
    auto_caption: "Auto 20%: **{v:.1f} Pa**"
  singulares:
    titulo: "ΔP singulares (entrada, salida, codos, manifold, difusor): **{v:.1f} Pa**"
    v_label: Velocidad del aire en ducto principal [m/s]
    v_help: >-
      Velocidad típica en ductos de secadores solares: 5–10 m/s.
      Más alta → más pérdida singular. Para ductos de ø≈15 cm con
      Q≈900 m³/h, v ≈ 14 m/s.
    detalle: |
      n_paralelo = {n_par} · n_codos asumidos = 2 · coeficientes C de ASHRAE cap. 21 / Idelchik

      - Entrada (C=0.5): {entrada:.1f} Pa
      - Salida descarga libre (C=1.0): {salida:.1f} Pa
      - 2 codos 90° (C=0.9 c/u): {codos:.1f} Pa
      - Manifold banco→caño, confluencia (C=1.5): {manifold:.1f} Pa
      - Difusor de entrada a cámara (C=0.3): {difusor:.1f} Pa
    bocas: >-
      ↳ **Bocas de la cámara (P4): {dp:.1f} Pa** — entrada {a_in:.4f} m² / salida
      {a_out:.4f} m². Calculadas sobre el área real, reemplazan a los términos
      de entrada, salida y difusor de arriba (que los estiman sobre la velocidad
      del ducto, o sea suponiendo bocas del tamaño del ducto).
  total_preview: >-
    **ΔP total estimada: {total:.1f} Pa** (col={col:.1f} + cam={cam:.1f} +
    duc={duc:.1f} + sing={sing:.1f})
  cano_caption: "↳ ΔP ductos incluye el **caño maestro** (P3): {v:.1f} Pa del manifold del banco."
