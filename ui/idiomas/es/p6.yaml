chimenea:
  titulo: Chimenea solar
  cargar:
    titulo: 📥 Cargar configuración de chimenea (.json)
    uploader: Subí un archivo .json de chimenea previamente guardado
    error_reconstruccion: "❌ Error reconstruyendo la chimenea: {exc}"
    exito: ✅ Chimenea cargada desde JSON (se reiniciaron {n} valores).
  usar:
    label: Incorporar chimenea solar
    help: >-
      Una chimenea genera tiraje térmico por diferencia de densidad entre
      el aire caliente (cámara + chimenea) y el ambiente. Modelo en
      `calculos.chimenea_calc`.
  sin_chimenea: Sin chimenea. El aire se moverá solo por difusión libre.
  diametro: Diámetro interno [m]
  altura: Altura [m]
  material: Material
  extractor:
    check: Agregar extractor eólico en el tope
    check_help: >-
      Turbina pasiva tipo 'sombrero chino' montada en el tope de la
      chimenea. Agrega un término motriz ΔP = Cp·ρ·v_viento²/2 al lazo
      natural, donde v_viento se corrige del valor NASA POWER (10 m) a
      la altura del tope via perfil logarítmico de capa límite. Tambien
      introduce una resistencia adicional Kt·ρ·v_flujo²/2 al flujo
      ascendente.

      **Casos límite:**
      • v_viento = 0 (calma): la turbina sólo agrega resistencia → peor que chimenea desnuda.
      • Sin sol (noche/nublado): si hay viento, la turbina sigue moviendo aire — robustez del sistema.
      • v_viento alto + sol: efectos se suman, caudal mayor.

      Sin correlación específica de literatura; los rangos de Cp y Kt son anclajes de orden de magnitud (Idelchik / hojas técnicas de turbinas comerciales).
    titulo: Parámetros del extractor eólico
    diam:
      label: Diámetro del extractor [m]
      help: >-
        Diámetro del orificio del extractor. Tallas comerciales
        típicas: 0.30 / 0.45 / 0.60 m. Recomendado ≥ al
        diámetro de la chimenea para evitar estrangulamiento.
    cp:
      label: Cp turbina [adim]
      help: >-
        Coeficiente de presión motriz: ΔP_motriz = Cp·ρ·v² / 2.
        Rango típico 0.3–0.6 para turbinas sombrero chino.
        Valores más altos sólo con datos de fabricante.
    kt:
      label: Kt turbina (resistencia) [adim]
      help: >-
        Coeficiente resistivo: ΔP_resistencia = Kt·ρ·v_flujo²/2
        sobre la velocidad del aire en el extractor.
        1.0 (default) cubre expansión + obstrucción de álabes.
    z0:
      label: Terreno (z₀)
      help: >-
        Longitud de rugosidad aerodinámica del terreno. Se usa
        para corregir el viento del sitio (a 2 m) a la altura del
        tope de chimenea via perfil logarítmico
        v(z) = v(2)·ln(z/z₀)/ln(2/z₀). Es una propiedad del sitio:
        se define una sola vez en P2 → Ubicación y la comparten la
        chimenea y la ingesta de clima medido.
      origen: 📍 {terreno} — definido en P2 → Ubicación.
    preview_viento: >-
      Viento medio del sitio (P2, a 2 m): **{vref:.1f} m/s** → corregido
      a {z:.1f} m del tope: **{vloc:.2f} m/s** → ΔP motriz turbina
      (a T_amb 20 °C): **{dp:.2f} Pa**.
    preview_sin_clima: >-
      Cargar datos de clima en P2 para previsualizar el efecto
      del viento a la altura del tope de la chimenea.
  error_validacion: "**Error de validación** — {err}"
  tiro:
    titulo: "**Tiro térmico estimado** (cámara + chimenea como columna ascendente)"
    metric_dt: ΔT = +{dt:.0f} K
    caption: >-
      Cálculo informativo con T_amb=20 °C, H_efectiva = altura_chimenea
      ({alt:.1f} m) + alto_cámara ({hcam:.2f} m) = {heff:.2f} m. El caudal
      de equilibrio se resuelve en `balance_global` con T_chim del lazo y
      pérdidas reales.
  guardar:
    txt: Guardar configuración de chimenea (.txt)
    json: Guardar configuración de chimenea (.json)
  calcular:
    falta_camara: >-
      ⚠️ Configurá la cámara (P4) antes de evaluar la chimenea — su
      caudal de diseño y ΔP son inputs del lazo natural.
    boton: 🌪️ Calcular chimenea
    spinner: Resolviendo lazo natural por chimenea...
    error_calculo: "❌ Error en el cálculo: {exc}"
    prompt: >-
      Presioná **Calcular chimenea** para resolver el lazo natural con
      condiciones representativas. El resultado queda persistido y se
      muestra en P7 como sección evaluada.
    titulo: Resultados del lazo natural
    caudal_natural:
      label: Caudal natural
      help: ṁ de equilibrio del lazo (cámara + colector + chimenea).
    v_chim:
      label: v en chimenea
      help: Velocidad media en la sección de la chimenea.
    re:
      label: Re chimenea
      help: "Re > 4000: turbulento. Re < 2300: laminar."
    dp_tiro:
      label: ΔP tiro térmico
      help: Empuje hidrostático = g·H_eff·(ρ_amb − ρ_chim).
    dp_ducto:
      label: ΔP ducto chimenea
      help: Fricción + singulares del ducto de chimenea.
    dp_resto:
      label: ΔP resto (col+cam)
      help: ΔP de colector + cámara escalado cuadrático al caudal de equilibrio.
    dp_turbina:
      label: ΔP motriz turbina
      help: "Extractor eólico a v_local={v:.2f} m/s."
    h_eff: H efectiva
    advertencias: "⚠️ {n} advertencia(s) del lazo natural"
    inputs: >-
      Inputs: T_amb={t_amb:.1f} °C, T_chim={t_chim:.1f} °C
      (heurística ΔT={dt:.0f} K para {tipo}), v_viento={v:.1f} m/s,
      P={p:.2f} kPa. Clima: {clima}. Presión: {presion}.
      En P7 se vuelve a resolver con el lazo Picard completo (T_chim de la
      cámara realimenta el cálculo).
    tipo_caja: CAJA
    tipo_otro: ARMARIO/GRAN_ESCALA
condiciones:
  media_anual: media anual NASA POWER (P2)
  fallback: fallback (T=20 °C, v=2 m/s)
