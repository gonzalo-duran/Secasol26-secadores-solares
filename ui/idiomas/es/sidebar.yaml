como_empezar:
  titulo: 👋 Cómo empezar
  cuerpo: |
    **Secasol** predimensiona secadores solares paso a paso. Recorré las secciones en orden:

    1. **Tipología** — tipo de secador y modo de análisis.
    2. **Emplazamiento** — coordenadas del sitio y descarga del clima (NASA POWER).
    3. **Colector** — materiales, geometría y velocidad de aire.
    4. **Cámara** — geometría, producto a secar y carga.
    5. **Auxiliar** — calentamiento de respaldo (opcional).
    6. **Motor** — ventilador o chimenea solar para mover el aire.
    7. **Resultados** — corre el prediseño completo y exporta el reporte.

    **Tené a mano:** latitud/longitud del sitio y el producto a secar.

    ℹ️ Es una herramienta de **prediseño** (orden de magnitud), no de certificación.
