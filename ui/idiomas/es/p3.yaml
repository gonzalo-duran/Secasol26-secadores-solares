campo:
  titulo: Evaluación del campo de colectores
  intro: >-
    Red hidráulica del **banco + caño maestro** (metodología ASHRAE
    cap. 21: fricción Darcy-Weisbach por tramo + pérdidas singulares
    de boca): reparto real de caudal entre ramas, temperatura de
    salida de cada rama a su caudal propio, mezcla en el manifold y
    T del flujo a la salida del caño maestro.
  origen_p4: el caudal del sistema configurado en P4 (caudal único S41)
  origen_banco: el caudal de diseño del banco (no hay cámara configurada)
  q:
    label: Caudal total [L/s]
    help: "Caudal que mueve el ventilador. Default: {origen}."
  t_amb: T ambiente [°C]
  poa:
    label: POA [W/m²]
    help: Irradiancia sobre el plano del colector (punto de operación representativo).
  viento: Viento [m/s]
  boton: Evaluar campo de colectores
  spinner: Resolviendo red hidráulica + térmica de {n} ramas...
  t_salida_cano: T salida caño maestro
  delta_cano: "{v:+.1f} K en el caño"
  t_mezcla: T mezcla del banco
  desuniformidad:
    label: Desuniformidad de reparto
    help: (q_máx − q_mín) / q_medio. Bajo 10 % se considera buen reparto.
  dp_sistema:
    label: ΔP del sistema (campo)
    help: "ΔP de trayectoria igualada: rama + troncal del caño maestro."
  dp_troncal:
    label: ΔP troncal del caño
    help: >-
      Pérdida del manifold solo (boca 1 lejana → ventilador),
      aislada de la rama. Es lo que responde a la compensación
      de sección del caño.
  v_troncal:
    label: v troncal (mín → máx)
    help: >-
      Velocidad del aire a lo largo del caño (extremo lejano →
      ventilador). Una sección creciente la mantiene acotada al
      acumular caudal; una sección chica constante la dispara
      cerca del ventilador.
  convergio: convergió
  no_convergio: "**no convergió**"
  caption_reparto: >-
    Reparto resuelto en {n} iteraciones ({estado}).
    q por rama: {qmin:.1f} – {qmax:.1f} L/s.
