header: 5 · Calentamiento Auxiliar
cargar:
  titulo: 📥 Cargar configuración guardada (.json)
  uploader: Subí un archivo .json del auxiliar previamente guardado
  error_reconstruccion: "❌ Error reconstruyendo el auxiliar: {exc}"
  exito: ✅ Auxiliar cargado desde JSON (se reiniciaron {n} valores de la sesión).
usar:
  label: Incorporar sistema de calentamiento auxiliar
  help: >-
    Activa un sistema de calentamiento auxiliar (resistencia eléctrica o quemador
    de biomasa) para extender el horario de secado o reforzar en días nublados.
  sin_auxiliar: >-
    Sin calentamiento auxiliar. El secador opera únicamente con energía solar.
    Activar el toggle para configurar un auxiliar.
tipo_modo:
  titulo: Tipo y modo de operación
  tipo:
    label: Tipo de fuente de calor auxiliar
    help: |
      Resistencia eléctrica: η ≈ 1, control preciso, requiere red eléctrica.
      Quemador de biomasa: η ≈ 0.60–0.75, combustible local, control más simple.
    resistencia_electrica: Resistencia eléctrica
    quemador_biomasa: Quemador de biomasa
  modo:
    label: Modo de operación
    help: |
      **Serie post-colector:** el auxiliar calienta el aire luego del colector. Úselo como refuerzo en días nublados o para alcanzar temperaturas más altas.

      **Respaldo independiente:** el auxiliar tiene su propio circuito de aire. Úselo para secado nocturno o días sin sol.
    serie_poscolector: Serie post-colector
    respaldo_independiente: Respaldo independiente
operacion:
  titulo: Parámetros de operación
  potencia:
    label: Potencia nominal [kW]
    help: >-
      Potencia térmica nominal entregada al aire.
      Para resistencia eléctrica: potencia eléctrica = potencia térmica.
  fraccion:
    label: Fracción de potencia en operación [%]
    help: Permite modelar operación parcial del auxiliar.
  t_max:
    label: T máxima de salida [°C]
    help: >-
      Límite de seguridad para proteger el producto.
      Para frutas y hortalizas: ≤ 60–70 °C.
  set_point:
    check: Control por set point de temperatura
    check_help: >-
      Si está activo, el auxiliar regula su potencia para mantener
      la temperatura de salida en el valor objetivo.
    label: Set point [°C]
  nocturno:
    label: Disponible para operación nocturna
    help: >-
      Resistencia eléctrica: disponible si hay red eléctrica.
      Quemador de biomasa: generalmente disponible.
biomasa:
  titulo: Parámetros del quemador de biomasa
  combustible: Combustible
  otro: Otro (ingresar manualmente)
  opcion:
    lena: Leña seca (~20% HR)
    pellets: Pellets de madera
    girasol: Cáscara de girasol
    bagazo: Bagazo de caña (seco)
  pci:
    label: PCI [MJ/kg]
    help: Poder calorífico inferior del combustible.
  nombre_combustible: Nombre del combustible
  eficiencia: Eficiencia del quemador [%]
  consumo_estimado: >-
    💡 Consumo estimado a potencia efectiva ({potencia:.2f} kW):
    **{consumo:.2f} kg/h** de {combustible}
resistencia:
  titulo: Parámetros de la resistencia eléctrica
  especificar_tension: Especificar tensión de alimentación
  tension:
    label: Tensión [V]
    help: 220 V monofásico o 380 V trifásico.
  corriente:
    label: Corriente estimada
    help: I = P / (V × cos_phi), cos_phi = 0.85.
calendario:
  titulo: 🌅 Calendario de arranque (híbrido mañana/tarde)
  intro: >-
    Por defecto el auxiliar opera **de día** (cuando hay sol, según I_g)
    salvo que habilites operación nocturna. Si en cambio cargás un
    **calendario de arranque**, el quemador opera **solo en esas ventanas
    horarias** (mañana y/o atardecer), independiente del sol — el patrón del
    secador híbrido solar-biomasa estilo ADITAL, donde el colector cubre el
    mediodía y la leña arranca/refuerza en los bordes del día. Aplica a los
    modos transitorios (Día real, multi-día y ventana de producción).
  usar:
    label: Usar calendario de arranque
    help: "Sin tildar: el auxiliar opera por irradiancia (comportamiento por defecto)."
  n_cargas: Número de cargas diarias
  carga_inicio: Carga {i} — hora de inicio [h]
  carga_duracion: Carga {i} — duración [h]
  cobertura: >-
    ⏱️ Cobertura total: **{horas:.1f} h/día** en {n} ventana(s).
    Fuera de ellas el auxiliar queda apagado.
aplicar: ⚙️ Aplicar auxiliar
error_config: "❌ Error de configuración: {exc}"
advertencias_titulo: Advertencias de diseño
sin_advertencias: ✅ Auxiliar configurado sin advertencias.
efecto:
  titulo: Estimación del efecto térmico
  t_entrada:
    label: Temperatura de entrada al auxiliar [°C]
    hint_serie: T_salida del colector (modo serie).
    hint_respaldo: T_ambiente (modo respaldo independiente).
  caudal:
    label: Caudal másico [kg/s]
    hint_colector: "Tomado del colector: {q:.1f} L/s → ~{kg:.3f} kg/s"
    hint_camara: Tomado de la cámara de secado.
    hint_default: Caudal de aire seco que pasa por el auxiliar.
  error_calculo: "❌ Error en el cálculo: {exc}"
  t_entrada_metric: T entrada
  t_salida: T salida
  potencia_efectiva:
    label: Potencia efectiva
    help: "Fracción activa: {frac:.0%}"
  consumo_biomasa:
    label: Consumo biomasa
    help: A la potencia efectiva de operación.
  consumo_electrico: Consumo eléctrico
  set_point_activo: >-
    ℹ️ Control de set point activo: el auxiliar opera al {frac:.0%} de su
    potencia nominal para mantener {t_salida:.1f} °C a la salida.
tsal_aux:
  titulo: Temperatura de salida del auxiliar T_sal_aux(t)
  caption: >-
    Sobre el horizonte de análisis (P1/P4). La curva de entrada es la salida
    del colector (o el ambiente en tipología CAJA), modulada por el clima; la
    banda naranja es el ΔT sensible que aporta el auxiliar. Reproduce el mismo
    cálculo transitorio que P7.
  grafica_titulo: "Auxiliar: T de entrada → T de salida"
  eje_tiempo: Tiempo [h]
  eje_t: Temperatura [°C]
  leyenda:
    t_entrada: T entrada (salida colector / ambiente)
    t_salida: T salida del auxiliar
    set_point: "Set-point {v:.1f} °C"
  sin_horizonte: >-
    ℹ️ Para ver T_sal_aux(t) configurá y calculá el horizonte transitorio en
    la pestaña 4 (Cámara) — de ahí sale la T de entrada al auxiliar hora a hora.
  horizonte_stale: >-
    ⚠️ El horizonte cambió después de calcularlo en P4; recalculalo allí para
    que esta gráfica quede al día.
  caudal_chimenea: >-
    ℹ️ Hay chimenea: el caudal real lo fija el tiro (lo resuelve P7). Acá se
    usa el caudal de diseño para estimar el ΔT.
  error: "❌ Error en el cálculo del auxiliar: {exc}"
  lectura_inactivo: >-
    El auxiliar no opera en ningún momento del horizonte (revisá disponibilidad
    nocturna / calendario de arranque).
  lectura_sin_sp: >-
    Sin set-point: el auxiliar aporta un ΔT **constante de {dt:.1f} °C** durante
    las {horas:.1f} h que opera (calentamiento sensible).
  lectura_alcanza: >-
    ✅ Colector + auxiliar alcanza el set-point de {sp:.1f} °C durante
    **{horas:.1f} h**.
  lectura_corto: >-
    ⚠️ Queda corto (potencia insuficiente) durante **{horas:.1f} h**: en esas
    horas el auxiliar opera a plena potencia sin llegar al set-point.
  lectura_nunca: >-
    ⚠️ Con esta potencia, colector + auxiliar **nunca** alcanza el set-point de
    {sp:.1f} °C en el horizonte.
  lectura_colector_solo: >-
    Durante {horas:.1f} h el colector solo ya supera el set-point (el auxiliar
    no aporta calor en esas horas).
resumen:
  titulo: Resumen de la configuración
  tipo: "**Tipo:** {v}"
  modo: "**Modo:** {v}"
  potencia: "**Potencia nominal:** {v:.2f} kW"
  fraccion: "**Fracción operación:** {v} %"
  t_max: "**T_max salida:** {v:.0f} °C"
  set_point: "**Set point:** {v}"
  set_point_valor: "{v:.0f} °C"
  set_point_no: No definido
  nocturno: "**Disponible nocturno:** {v}"
  combustible: "**Combustible:** {v}"
  pci: "**PCI:** {v:.1f} MJ/kg"
  pci_no: "**PCI:** —"
  eta: "**η quemador:** {v:.0%}"
  eta_no: "**η quemador:** —"
  tension: "**Tensión:** {v:.0f} V"
  tension_no: "**Tensión:** No especificada"
si: Sí
"no": "No"
