como_empezar:
  titulo: 👋 Getting started
  cuerpo: |
    **Secasol** pre-sizes solar dryers step by step. Go through the sections in order:

    1. **Typology** — dryer type and analysis mode.
    2. **Site** — site coordinates and climate download (NASA POWER).
    3. **Collector** — materials, geometry and air velocity.
    4. **Chamber** — geometry, product to dry and load.
    5. **Auxiliary** — backup heating (optional).
    6. **Fan / Drive** — fan or solar chimney to move the air.
    7. **Results** — runs the full pre-design and exports the report.

    **Have at hand:** the site latitude/longitude and the product to dry.

    ℹ️ This is a **pre-design** tool (order of magnitude), not a certification tool.
