header: 6 · Fan / Drive
intro: >-
  The air moves by **forced convection** (fan/motor) or **natural** (solar
  chimney, no electricity). Forced: more flow control and the ability to
  overcome high pressure drops (thick beds, collector bank, industrial scale),
  at the cost of energy. Natural: no electricity, lower flow that varies with
  sun and wind — needs a chimney to induce draft. Choose with the toggle below.
cargar:
  titulo: 📥 Load saved configuration (.json)
  uploader: Upload a previously saved fan .json file
  error_reconstruccion: "❌ Error rebuilding the fan: {exc}"
  exito: ✅ Fan loaded from JSON ({n} session values were reset).
usar:
  label: Add forced-convection system (fan / motor)
  help: >-
    Turn off for natural-convection typologies
    (box-type dryer with chimney, or cabinet without a fan).
  sin_motor: >-
    No fan. The dryer runs by natural convection.
    Configure the solar chimney below to induce thermal draft,
    or toggle it on to size a fan.
accionamiento:
  titulo: Drive type
  caption: >-
    Electric motor (axial or centrifugal fan). For natural convection —
    optionally with a wind extractor at the chimney top — turn off the
    fan with the toggle above.
caudal:
  titulo: Design flow
  hint_colector: "Collector (P3): {q:.1f} L/s"
  hint_camara: "Chamber (P4): {g:.1f} g/s → {l:.1f} L/s (at 50 °C)"
  label: Volumetric flow [L/s]
  help_default: Flow the fan must move.
  metric: Flow
perdidas:
  titulo: System pressure drops
  modo:
    label: Pressure-drop input
    help: |
      **By components:** estimates ΔP_collector (Darcy-Weisbach) and ΔP_chamber (tray resistance) from P3 and P4, plus a 20% duct margin.

      **Direct total ΔP:** enter the field-measured or catalogue value.
    componentes: By components (auto-estimated)
    total: Direct total ΔP
  total:
    label: System total ΔP [Pa]
    help: Includes collector, chamber and ducts.
  colector:
    label: Collector ΔP [Pa]
    help_auto: "Collector-bank pressure drop (Darcy-Weisbach). Auto (P3): {v:.1f} Pa."
    help_sin: Collector-bank pressure drop (Darcy-Weisbach). Configure P3 for auto-estimation.
    auto_caption: "Auto P3: **{v:.1f} Pa**"
  camara:
    label: Chamber ΔP [Pa]
    help_auto: "Chamber-tray pressure drop. Auto (P4): {v:.1f} Pa (K_mesh=2.0)."
    help_sin: Chamber-tray pressure drop. Configure P4 for auto-estimation.
    auto_caption: "Auto P4: **{v:.1f} Pa**"
  ductos:
    check: Specify duct ΔP
    label: Duct ΔP [Pa]
    auto_caption: "Auto 20%: **{v:.1f} Pa**"
  singulares:
    titulo: "Minor-loss ΔP (inlet, outlet, elbows, manifold, diffuser): **{v:.1f} Pa**"
    v_label: Air velocity in the main duct [m/s]
    v_help: >-
      Typical velocity in solar-dryer ducts: 5–10 m/s.
      Higher → more minor loss. For ø≈15 cm ducts with
      Q≈900 m³/h, v ≈ 14 m/s.
    detalle: |
      n_parallel = {n_par} · assumed n_elbows = 2 · C coefficients from ASHRAE ch. 21 / Idelchik

      - Inlet (C=0.5): {entrada:.1f} Pa
      - Free-discharge outlet (C=1.0): {salida:.1f} Pa
      - 2 × 90° elbows (C=0.9 each): {codos:.1f} Pa
      - Bank→duct manifold, junction (C=1.5): {manifold:.1f} Pa
      - Chamber inlet diffuser (C=0.3): {difusor:.1f} Pa
  total_preview: >-
    **Estimated total ΔP: {total:.1f} Pa** (col={col:.1f} + cham={cam:.1f} +
    duct={duc:.1f} + minor={sing:.1f})
  cano_caption: "↳ Duct ΔP includes the **main duct** (P3): {v:.1f} Pa of the bank manifold."
