header: Site and Climate Resources
error_validacion: "Validation error ({codigo}): {err}"
ubicacion:
  titulo: Geographic location
  lat:
    label: Latitude [°]
    help: "North positive. Range: −90° to +90°."
  lon:
    label: Longitude [°]
    help: "East positive. Range: −180° to +180°."
  alt:
    label: Altitude [m a.s.l.]
    help: Site altitude. NASA POWER reports the altitude of its grid point.
  zona:
    label: Time zone
    help: IANA identifier of the local time zone.
  referencia: Geographic reference
  hemisferio_norte: North
  hemisferio_sur: South
  meridiano_este: East
  meridiano_oeste: West
  resumen: "**Lat:** {lat:.4f}° {hemisferio}\n\n**Lon:** {lon:.4f}° {meridiano}\n\n**Alt:** {alt:.0f} m"
orientacion:
  titulo: Collector orientation
  nota_caja: >-
    🧊 **Box** typology: there is no external collector — the chamber acts
    as the collector. Its orientation, roof pitch and translucent surfaces
    are configured in **P4 · Chamber**.
  acimut:
    label: Collector azimuth [°]  —  0° = South, 90° = East, 180° = North, 270° = West
    help: "Convention: 0° = South, 90° = East, 180° = North, 270° = West.\nIn the southern hemisphere an optimal collector faces North (180°)."
  pendiente:
    label: Tilt / slope [°]  —  0° = horizontal, 90° = vertical
    help: Angle between the collector plane and the horizontal.
  caption: Collector orientation
  puntos:
    sur: South
    se: SE
    este: East
    ne: NE
    norte: North
    "no": NW
    oeste: West
    so: SW
  aprox: Approximate orientation
  acimut_pvlib: "pvlib azimuth (internal): {v:.1f}°"
  inclinacion: "Tilt: {v:.1f}°"
clima:
  titulo: NASA POWER climate data
  anio:
    label: Reference year
    help_base: "Calendar year of the hourly data. Range available in NASA POWER: {anio_min}–{anio_max}. "
    help_sync: Synchronized with P1 ({sync}). You can override it.
    help_sin_sync: >-
      When you pick a specific day or a production window in P1,
      this year adjusts automatically.
  sync_ventana: production window starting {fecha}
  sync_dia: specific day {fecha}
  forzar:
    label: Force re-download
    help: Ignores the local cache and downloads again from NASA POWER.
  descargar: Download data
  spinner: "Downloading NASA POWER data for ({lat:.4f}, {lon:.4f}), year {anio}..."
  exito: "Data loaded: {n:,} hourly records. NASA POWER altitude: {alt:.0f} m a.s.l."
  error_descarga: "Download error: {err}"
calidad:
  registros: Total records
  anio_datos: Data year
  interpoladas:
    label: Interpolated hours
    help: Gaps ≤ 3 h fixed by interpolation.
  bloqueadas:
    label: Blocked hours
    help: Gaps > 3 h that require a user decision.
  anio_distinto_ventana: >-
    ⚠️ The downloaded climate is from year **{anio_clima}**, but the P1
    production window starts in **{anio_ventana}**.
    P7 will evaluate the window with the downloaded year's data.
    To use the right climate, download year {anio_ventana}.
  huecos_warning: >-
    {n} hours with missing data were detected
    (largest gap: {mayor} h > 3 h interpolation limit).
    Later calculations may fail if those hours are processed.
  como_continuar: How to proceed?
  opcion_aceptar_con_nulos: Continue with missing hours (NaN). Calculations will skip those instants.
  opcion_descargar_nuevo_anio: Pick another year and download again.
  confirmar: Confirm decision
  decision_guardada: Decision saved. You can continue with the pre-design.
  nulos_aceptados: "{n} hours with NaN accepted. Calculations will skip those instants."
anual:
  titulo: Annual climate resource
  caption: "NASA POWER hourly data — Year {anio} — ({lat:.4f}°, {lon:.4f}°)"
  poa_plano_colector: the collector plane
  poa_techo_camara: the chamber roof
  spinner_poa: Computing irradiance on {plano}...
  ghi_anual: Annual GHI
  poa_anual: Annual POA (collector plane)
  delta_vs_ghi: "{delta:+.0f} vs GHI"
  pend_acimut: Tilt / Azimuth
  nota_transposicion: >-
    Horizontal plane: raw NASA POWER data (GHI, DNI, DHI).
    Collector plane: irradiance transposed with the Hay-Davies model (pvlib),
    using the tilt and azimuth configured above.
tabs:
  temperatura: Temperature
  irradiancia: Solar irradiance
  viento_hr: Wind and Humidity
  tabla: Monthly table
dia:
  titulo: Climate resource of the design day
  caption: "Hourly profile for {fecha} ({criterio}) — ({lat:.4f}°, {lon:.4f}°)"
  criterio:
    especifico: specific day
    solsticio_verano: summer solstice
    solsticio_invierno: winter solstice
    equinoccio_marzo: autumn equinox (southern hem.)
    equinoccio_septiembre: spring equinox (southern hem.)
    mas_caluroso: hottest day
    mas_frio: coldest day
    default: design day
  sin_datos: >-
    There is no data for {fecha} in year {anio}. Check that the climate
    series year matches the design-day year.
  t_media: Mean T
  t_min_max: T min / max
  ghi_dia: Daily GHI
  poa_dia: Daily POA
  viento_medio: Mean wind
  nota_transposicion: >-
    Horizontal plane: raw NASA POWER data.
    Collector plane: Hay-Davies model (pvlib),
    with the tilt and azimuth configured above.
  csv: Download CSV of the day ({fecha})
ventana:
  titulo: Climate resource of the production window
  caption: >-
    Span {inicio} → {fin} ({dias} days, {horas} hours of real climate,
    year {anio}) — ({lat:.4f}°, {lon:.4f}°)
  ghi: Window GHI
  poa: Window POA
  csv: Download CSV of the window ({inicio} → {fin})
exportar:
  titulo: Export data
  csv: Download CSV (user units)
  csv_help: >-
    Exports the data in user units: T [°C], GHI/DNI/DHI [W/m²],
    Wind [m/s], RH [%], Pressure [hPa]. Index in local time.
sin_clima: >-
  Enter the site coordinates and press **Download data**
  to fetch the annual NASA POWER climate series.
tabla:
  mes: Month
  t_prom: Mean T [°C]
  t_min: T min [°C]
  t_max: T max [°C]
  ghi: GHI [kWh/m²]
  dni: DNI [kWh/m²]
  dhi: DHI [kWh/m²]
  viento: Wind [m/s]
  hr: RH [%]
  presion: Pressure [hPa]
csv:
  indice: local_datetime
  t_amb: T_amb [°C]
  ghi: GHI [W/m²]
  dni: DNI [W/m²]
  dhi: DHI [W/m²]
  viento: Wind [m/s]
  hr: RH [%]
  presion: Pressure [hPa]
fuente:
  titulo: Climate data source
  nasa_power: NASA POWER (satellite download)
  medido: Measured data (own file)
medido:
  intro: >-
    Upload a CSV or Excel file with your own measurements (weather station,
    campaign datalogger). Missing variables are completed with NASA POWER and
    every column is labeled with its provenance.
  uploader:
    label: Measured data file
    help: >-
      CSV (comma or semicolon separator, point or comma decimal) or Excel
      (.xls / .xlsx). It must include a date/time column.
  archivo_cargado: "📄 **{nombre}** ({kb} kB)"
  quitar: Remove file
  hoja:
    label: Excel worksheet
  fila_enc:
    label: Header row
    help: Index (from 0) of the row containing the column names.
  preview_titulo: 👀 File preview (first rows)
  mapeo:
    titulo: "#### Column mapping"
    caption: >-
      Select which file column corresponds to each variable and its measurement
      unit. Unmapped variables are completed with NASA POWER.
    timestamp: Date/time column
    no_mapear: (do not map)
    unidad: Unit
  variable:
    T_amb_K: Ambient temperature
    GHI_Wm2: Global horizontal irradiance (GHI)
    DNI_Wm2: Direct normal irradiance (DNI)
    DHI_Wm2: Diffuse horizontal irradiance (DHI)
    WS_ms: Wind speed
    presion_Pa: Atmospheric pressure
    HR: Ambient relative humidity
    POA_med_Wm2: Global irradiance on collector plane (measured POA)
  unidad:
    C: °C
    K: K
    F: °F
    W_m2: W/m²
    kW_m2: kW/m²
    m_s: m/s
    km_h: km/h
    Pa: Pa
    kPa: kPa
    hPa: hPa
    mbar: mbar
    atm: atm
    fraccion: fraction (0–1)
    porcentaje: "%"
  convencion:
    label: Timestamp convention
    help: >-
      Is the value recorded at 10:00 an instantaneous reading, or the average of
      the interval ending (or starting) at 10:00? Campbell dataloggers usually
      record instantaneous readings or previous-interval averages.
    instantanea: Instantaneous reading
    promedio_fin: Average of the previous interval
    promedio_inicio: Average of the next interval
  tz:
    label: Time zone of the file timestamps
  alt_viento:
    label: Anemometer height [m]
    help: >-
      The internal contract uses wind at 2 m; the series is normalized with a
      neutral logarithmic profile (z₀ = 0.05 m).
  plano:
    label: Plane of the global-irradiance pyranometer
    help: >-
      If the sensor is mounted coplanar with the collector, the measurement
      replaces the Liu-Jordan transposition for the collector (higher accuracy).
    horizontal: Horizontal (GHI)
    plano_colector: On the collector plane (POA)
  falta_variables: ⚠️ Map at least one climate variable before processing.
  procesar: Process file
  spinner: Conditioning measured data (QC + resampling + NASA completion)…
  error: "❌ {err}"
  procedencia:
    titulo: "#### Provenance of each variable"
    variable: Variable
    origen: Provenance
    medida: Measured (user file)
    derivada: Derived (Erbs from measured GHI)
    completada_nasa: Completed with NASA POWER
    default: Default value
  resumen:
    previo: "Period {inicio} → {fin} · native step {paso} s · hours at the hourly contract: {n_horas}."
    confirmado: >-
      ✅ {fuente} climate confirmed: {inicio} → {fin} · native step {paso} s ·
      {n_meses} month(s) with data.
    hibrido: hybrid (measured + NASA POWER)
  qc:
    titulo: "🔬 Physical quality control — findings: {n}"
    sin_hallazgos: No findings — all variables within physical ranges.
    detalle: "{chequeo} — {variable} — affected values: {n}. Examples: {ejemplos}"
    chequeo:
      rango_fisico: Out of physical range (→ voided)
      ghi_nocturna: Night-time irradiance (→ 0)
      ghi_extraterrestre: Exceeds extraterrestrial (→ voided)
      sensor_congelado: Possibly frozen sensor (warning)
  confirmar: Use this climate in the project
  exito: ✅ Measured climate loaded into the project.
  opcion_descartar: Discard this climate and fix the mapping
  snapshot:
    titulo: 💾 Save / load ingestion configuration
    guardar: ⬇️ Download configuration (.json)
    cargar: Load configuration (.json)
    restaurado: ✅ Measured climate restored from the local cache.
    falta_archivo: >-
      ℹ️ The local cache does not contain this ingestion: upload the data file
      again (the saved mapping will be used as a suggestion).
    error: "❌ {err}"
