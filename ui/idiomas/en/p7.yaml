    The forcing T_amb(t), T_col_out(t), v_wind(t), I_g(t), ω(t) comes from
    P4 exactly as you simulated it. If you configured an **Auxiliary (P5)**,
    it is applied step by step to the chamber inlet T before re-running the
    thermodynamic engine.
  boton: ▶ Compute transient pipeline
  spinner: Running auxiliary(t) + TD chamber + fan...
  prompt: ℹ️ Press **Compute** to evaluate the transient pipeline.
