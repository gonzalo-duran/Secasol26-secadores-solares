    label: Chimney ΔP
    help: Friction + minor losses of the chimney duct.
  dp_resto:
    label: Rest-of-loop ΔP
    help: Collector + chamber losses scaled ∝ (ṁ/ṁ_design)².
  h_eff:
    label: Effective H
    help: chimney_height + chamber_height.
  balance: >-
    Loop balance: ΔP_draft = ΔP_chim + ΔP_rest
