carta:
  titulo: Process psychrometric chart
  caption: >-
    Humid-air states along the process, corrected to the site pressure.
    Heating in the collector and auxiliary is **sensible** (constant ω →
    horizontal segments); in the chamber the air **gains humidity**. The
    dotted isenthalp is the adiabatic reference from the chamber inlet:
    if the outlet falls on it drying was ≈ adiabatic (indirect chamber);
    above it, there was heat gain (direct chamber with translucent roof).
    In time-evolving modes the shown state is the one of maximum irradiance
    (≈ solar noon).
