  ⚠️ To compute results you must configure at least the
  **Drying Chamber (P4)**.
anual_prompt_detalle: Single representative-day calculation (additional context)
anual_prompt_detalle_cap: >-
  Below is the calculation of a single day (constants or transient).
  It is useful to validate the engine or explore transients — the annual
  results that matter are above. If you don't want to see it, ignore this
  section.
anual_sin_calcular: >-
  📅 **ANNUAL mode enabled.** To see the monthly and aggregated annual
  results, go to **P4** and press the '📅 Compute annual operation' button.
  Meanwhile a single representative-day calculation is shown.
modo:
  titulo: Calculation mode
  label: How do we evaluate the full pre-design?
  transitorio: Transient (P4 horizon)
  constantes: Representative constants
  help: |
    Transient: uses the hourly forcing you ran the chamber thermodynamic engine with (P4), adds the auxiliary step by step and reports results integrated over the horizon.

    Constants: scalar representative conditions — a single design point.
  sin_horizonte: >-
    ℹ️ To enable the **transient mode**, first run the chamber in P4 with
    'Synthetic day' or 'Real day' forcing. The horizon will propagate
    automatically here.
horizonte:
  titulo: Propagated chamber horizon
