    anio: 1 year
  inicio: Start
  fin: End
  fin_anterior: ⚠️ The end date must be later than the start date.
  lapso_excesivo: >-
    ⚠️ The analysis span cannot exceed **366 days**
    (you chose {lapso_dias}). Shorten the window or use a shortcut.
  lapso_caption: "📆 Span: **{lapso_dias} days** of real hourly climate.{extra}"
  atajo_activo: " · Shortcut active: end = start + {dur} days (editing the end disables it)."
  cruza_anio: >-
    ⚠️ The window crosses the calendar year. NASA POWER climate data is
    downloaded per calendar year: choose a window within a single year so
    that P7 finds climate for the whole span.
