tipologia:
  titulo: Dryer typology
  guia:
    titulo: Which typology should I choose?
    cuerpo: |
      The typology defines the dryer architecture and which subsystems are enabled in the pre-design:

      | Typology | What it is | When | Subsystems |
      |---|---|---|---|
      | **Box** | Collector and chamber integrated; sunlight enters the chamber directly (translucent roof). Usually runs on natural convection. | Small scale, low investment (fruits, herbs). | Chamber (+ optional chimney) |
      | **Cabinet** | External collector + chamber with trays; forced or natural airflow. | Medium scale, better temperature control. | Collector + chamber + fan/chimney (+ auxiliary) |
      | **Large scale** | Collector bank + industrial chamber (batches or semi-continuous tunnel). | Commercial production (hundreds–thousands of kg). | Collector bank + main duct + chamber + fan + auxiliary |
  label: Select the typology
  help: The typology defines which subsystems are available in the pre-design.
  opcion:
    caja: Box (natural convection, no external collector)
    armario: Cabinet (external collector, 10–100 kg)
    gran_escala: Large scale (collector bank, 100 kg+)
  corta:
    caja: Box
    armario: Cabinet
    gran_escala: Large scale
  desc:
    caja: >-
      **Box-type dryer** — Small scale (~1–10 kg of fresh product).
      The chamber acts as the collector: direct greenhouse effect on the product.
      No external collector. Air moves by **natural convection**
      (a solar chimney can be added).
      Typical for household use or small producers.
    armario: >-
      **Cabinet-type dryer** — Medium scale (~10–100 kg of fresh product).
      Separate drying chamber with one or two external **solar air collectors**.
      Natural (chimney) or forced circulation (fan / wind extractor).
      Auxiliary heating can be added (electric resistance or biomass).
      Suitable for small and medium producers.
    gran_escala: >-
      **Large-scale dryer** — High capacity (~100 kg to several tonnes).
      **Bank of solar air collectors** in series/parallel with a main duct.
      **Forced** circulation with an electric fan.
      May include auxiliary heating.
      Aimed at agro-industrial production.
