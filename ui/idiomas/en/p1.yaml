subtipo:
  titulo: Industrial dryer subtype
  label: Dryer operation mode
  help: |
    **Batch:** a full load dries in batches; production is the sum of the batches completed within the window.

    **Semi-continuous:** the product advances counter-current to the air in an N-column tunnel; it delivers a sustained output (kg/day).
  opcion:
    batch: Batch — drying in batches (load → dry → unload)
    semicontinuo: >-
      Semi-continuous — counter-current tunnel, full load with trolley
      advance (ADITAL style)
  corta:
    batch: Batch
    semicontinuo: Semi-continuous
modo:
  titulo: Analysis mode
  clima_parcial: >-
    ℹ️ The climate loaded in P2 comes from measured data covering {n_meses}
    month(s): the Annual mode will not be available (it requires 12 months).
  caja_sin_anual: ℹ️ The **Annual** analysis is not available for the Box typology in v0.
  label: Analysis type
  help: |
    **Daily:** one selected day. Fast, for initial pre-design.

    **Production window:** accumulates production over a time span (week, month, campaign) with real hourly climate. Intended for large scale.

    **Annual:** integrates over the 8,760 hours of the year.
  opcion:
    diario: Daily — one representative day (hourly data)
    ventana: Production window — span [start, end] (real hourly climate)
    anual: Annual — full year (8,760 hours)
paso:
  label: Simulation time step
  help: |
    Time resolution of the transient calculation (Daily/Window modes).

    **1 hour:** standard, matches the hourly climate (NASA POWER).

    **15 min / 5 min:** fine step for sub-hourly measured data. With hourly climate the series are interpolated (synthetic resolution, no real transients).
  opcion:
    h: 1 hour (standard)
    15min: 15 minutes
    10min: 10 minutes
    5min: 5 minutes
  aviso_subhorario: >-
    ℹ️ Sub-hourly step: if the climate is hourly (NASA), the series are interpolated
    (synthetic resolution). With sub-hourly measured data the real resolution is used.
  aviso_fino: >-
    ⚠️ 5-min step: the collector (without thermal capacitance) over-reacts to cloud
    transients and overestimates the outlet temperature peaks. The computation is also
    noticeably slower.
dia:
  label: Criterion to select the analysis day
  help: >-
    Determines which day of the year is used for the calculation.
    Temperature- or insolation-based criteria use the site's NASA POWER
    data (requires P2 to be configured).
  opcion:
    solsticio_verano: Summer solstice (Dec 21) — longest day
    solsticio_invierno: Winter solstice (Jun 21) — shortest day
    equinoccio_marzo: Autumn equinox — Mar 21 (southern hemisphere)
    equinoccio_septiembre: Spring equinox — Sep 21 (southern hemisphere)
    mas_caluroso: Hottest day of the year (max T_amb)
    mas_frio: Coldest day of the year (min T_amb)
    especifico: Specific day defined by the user
  corta:
    solsticio_verano: Summer solstice
    solsticio_invierno: Winter solstice
    equinoccio_marzo: Autumn equinox
    equinoccio_septiembre: Spring equinox
    mas_caluroso: Hottest day
    mas_frio: Coldest day
    especifico: Specific day
  fecha:
    label: Analysis date
    help: "Exact date of the day to analyse. Range available in NASA POWER: {anio_min}–{anio_max}."
ventana:
  atajos_caption: "Duration shortcuts (the end follows the start date):"
  atajo:
