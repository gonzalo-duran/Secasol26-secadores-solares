  procesar: Process and compare
  spinner: Ingesting the test and running the isolated chamber…
  senal_ok: "Measured signal: {n} valid samples, native step ≈ {freq} min."
  sin_solape: There are no instants shared by the measured signal and the simulation.
  supuestos_titulo: "**Forcing assumptions** (what was not measured)"
  grafica:
    titulo: "{magnitud} — measured vs simulated"
    medido: Measured
    simulado: Simulated
  metricas_titulo: "**Goodness-of-fit metrics**"
  metrica:
    rmse: RMSE
    mbe: Bias (MBE)
    mae: MAE
    r2: R²
    nse: NSE
    d: Willmott index
  n_pares: "Computed over {n} aligned measured↔simulated pairs."
  interpretacion: >-
    RMSE = error magnitude; signed MBE (positive = the model overestimates) tells
    you what to calibrate; R² captures the shape (blind to bias).
  aviso_cstr: >-
    The model assumes well-mixed air (a single node): a sensor near the inlet
    reads hotter than the average and one near the outlet, colder. Part of the
    residual may be sensor position, not model error.
calibracion:
  titulo: "**🎯 Chamber model calibration**"
  intro: >-
    Sweep a transport coefficient and keep the value that best fits the
    simulation to the measurement. The result is a diagnostic: how far the model
    departs from the measurement, and in which direction.
  parametro: Coefficient to calibrate
  param:
    area_bandeja: Effective exchange area [m²]
    factor_K_m: Factor on K_m (mass transfer)
    factor_h_conv: Factor on h_conv (internal convection)
  ayuda_param: >-
    K_m governs the evaporation rate; h_conv drags K_m along through
    Chilton-Colburn, so it also changes the sensible heat.
  min: Minimum
  max: Maximum
  n: Number of points
  objetivo: Objective function
  obj:
    rmse: RMSE
    mbe_abs: "|MBE|"
    mae: MAE
  rango_invalido: The maximum must be greater than the minimum.
  correr: Calibrate
  spinner: Sweeping the coefficient and fitting against the measurement…
  sin_optimo: No point of the sweep could be evaluated (check the range or the time overlap).
  grafica_titulo: Objective function vs coefficient
  eje_x: Multiplicative factor
  optimo: Optimum
  resultado: "Optimum: factor {valor} → RMSE {rmse}, MBE {mbe}, R² {r2}."
  lectura_alto: >-
    A factor greater than 1 means the model **underestimates** transport: the
    real chamber dries faster than predicted.
  lectura_bajo: >-
    A factor smaller than 1 means the model **overestimates** transport: the real
    chamber dries slower than predicted.
  lectura_neutro: The model reproduces the test with no appreciable correction.
  aviso_hr: >-
    Careful: the inlet RH was not measured. An error in the inlet humidity is
    absorbed into this factor, so the calibrated value may be compensating the
    assumption rather than a model defect.
  es_aplicable: "This parameter **is a project field**: the optimum can be applied to the chamber."
  es_diagnostico: >-
    This coefficient is a **model diagnostic**, not a property of the chamber: it is not stored in the project, because what it absorbs (Chilton-Colburn analogy, cultivar isotherm, assumed inlet humidity) does not transfer to another product or flow rate.
  lectura_area: >-
    The fitted effective exchange area is **{veces}×** the declared tray area. For a layer of stacked slices, a value above 1 is expected.
  aplicar: "Apply the optimum to the chamber"
  aplicado: "Optimum applied to the chamber. Recompute the drying above."
cadena:
  titulo: "**🔗 Full-chain diagnosis**"
  intro: >-
    Besides the isolated chamber, compare the measurement against the whole-system
    result (collector → backup → chamber) computed in P7. You cannot calibrate on
    it: the residual mixes the error of every link.
  sin_resultado: Run the transient in P7 to enable this comparison.
  sin_ancla: >-
    The P7 result has no date attached (synthetic forcing). Run the transient with
    real weather so it can be aligned with the measurement.
  sin_solape: The measured period does not overlap the horizon computed in P7.
  grafica_titulo: "{magnitud} — measured vs full chain (P7)"
  simulado: Simulated (P7 chain)
  metricas: "Full chain: RMSE {rmse}, MBE {mbe}, R² {r2} over {n} pairs."
  comparacion: >-
    If the chain fits worse than the isolated chamber, the extra error comes from the
    upstream links (collector, duct, backup) or from the weather, not from the chamber.
