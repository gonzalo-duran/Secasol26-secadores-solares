header: 4 · Drying Chamber
info_caja: >-
  📦 **BOX typology**: the chamber acts as a direct dryer.
  The translucent roof is mandatory (the only energy source)
  and the operating temperature is that of the ambient air.
info_semicontinuo: >-
  🏭 **Large scale — Semi-continuous (counter-current tunnel)**: the total
  load and the geometry below are split into N columns in series; the air
  enters hot through the dry column and leaves humid through the fresh one.
  Configure the tunnel topology in its section.
cargar:
  titulo: 📥 Load saved configuration (.json)
  uploader: Upload a previously saved chamber .json file
  error_reconstruccion: "❌ Error rebuilding the chamber: {exc}"
  exito: ✅ Chamber loaded from JSON ({n} session values were reset).
producto:
  titulo: Product to dry
  sin_productos: >-
    No products with calibrated thin-layer models were found in the catalogue.
    Check the files in catalogo/productos/.
  label: Product
  help: >-
    Product to dry. Selecting it loads its sorption isotherm (GAB),
    basic properties and equilibrium moisture, which feed the coupled
    heat-mass balance of the chamber. Only products with calibrated data
    in the catalogue appear; if yours is missing, it must be calibrated first.
  x_ini:
    label: Initial moisture X₀ [kg water / kg ds]
    help: "Dry basis. Typically 4–16 kg/kg ds for fresh fruits and vegetables."
  x_obj:
    label: Target moisture X_obj [kg water / kg ds]
    help: >-
      Desired final moisture on a dry basis.
      Typical storage values: 0.10–0.20 kg/kg ds.
  masa: Total mass to dry [kg]
  gab_ok: ✅ Calibrated GAB isotherm available.
  gab_fallback: "⚠️ No GAB isotherm. X_eq = {x:.3f} kg/kg ds will be used (fallback)."
geometria:
  titulo: Chamber geometry
  esquema_titulo: 📐 Chamber diagram
  esquema_caption: Diagram of the drying chamber with its main dimensions.
  largo: Length [m]
  ancho: Width [m]
  alto: Height [m]
  volumen: "Internal volume: {vol:.3f} m³  |  Floor area: {area:.3f} m²"
  orientacion_titulo: "**Orientation and mono-pitch roof**"
  orientacion_caption: >-
    The chamber has its own orientation (independent of the collector-bank
    orientation in P2). The roof is mono-pitch: it slopes from the taller
    height to the shorter one on the chosen face.
  pendiente_techo:
    label: Roof pitch [°]
    help: "0° = flat roof (historical, no change in the balance)."
  acimut:
    label: Chamber azimuth [°] — 0°=South, 90°=East, 180°=North, 270°=West
    help: Azimuth of the outer normal of the 'front' face (same convention as P2).
  cara_caida:
    label: Roof low-side face
    help: >-
      Face the roof slopes toward (the shortest one).
      Left/right looking in the flow direction (from back to front).
    frente: Front
    atras: Back
    lateral_izq: Left side
    lateral_der: Right side
  preview_techo: >-
    Lower height: {menor:.2f} m  |  Higher height: {mayor:.2f} m  |
    Actual roof area: {area:.3f} m²  |  pvlib azimuth: {pvlib:.1f}°
vidriado:
  opaca: (opaque — no radiation to the product)
  material:
    label: Glazing material
    help: >-
      Opaque: chamber closed to the sun (pure indirect dryer).
      Translucent material: same material and thickness for all faces
      marked below; each one lets radiation into the product and the air
      according to its own orientation (see calculos/radiacion_camara.py).

      **BOX**: mandatorily translucent (at least one face), radiation is
      the only energy source without an external collector.
  tau: "τ_solar = {v:.2f} (from the catalogue)"
  espesor: Glazing thickness [mm]
  k_efectivo: "k_effective = {v:.3f} W/(m·K) (from the catalogue)"
  caras_titulo: "**Translucent surfaces**"
  caras_caption: >-
    Faces carrying the chosen glazing (same material/thickness on all).
    The floor is always opaque. Default: roof only (historical behaviour).
  cara_techo: Roof
  cara_frente: Front
  cara_atras: Back
  cara_lat_izq: Left side
  cara_lat_der: Right side
  sin_caras: >-
    ⚠️ No face is active: the chamber becomes thermally opaque
    (no radiative gain) even though the material is defined.
  caja_sin_caras: >-
    ❌ BOX typology requires at least one translucent face.
    Without an external collector, radiation is the only energy source.
  caja_sin_techo: >-
    ❌ BOX typology requires a translucent roof. Without an external
    collector and with an opaque cover, the dryer receives no energy.
  preview:
    cara: Face
    area: Area [m²]
    inclinacion: Tilt [°]
    acimut: Azimuth UI360 [°]
    translucida: Translucent
materiales:
  titulo: "**Chamber materials**"
  caption: >-
    The chosen composition applies to side walls, floor and roof
    (except when the roof is translucent, in which case it is handled
    separately above).
  tipo_pared:
    label: Wall type
    simple: Simple (1 material + thickness)
    compuesta: Composite (outer face + insulation + inner face)
    help: >-
      Simple: a single structural layer.
      Composite: outer face + insulation + inner face,
      thermal resistances in series.
  catalogo:
    label: Catalogue
    help: "fondos = sheet/structural wood; aislantes = wool, EPS, PUR."
  material: Material
  material_estructural: Material (structural)
  material_aislante: Material (insulation)
  espesor_mm: Thickness [mm]
  cara_externa: "**Outer face**"
  espesor_externa: Outer thickness [mm]
  aislante: "**Insulation**"
  espesor_aislante: Insulation thickness [mm]
  cara_interna: "**Inner face**"
  espesor_interna: Inner thickness [mm]
  resumen_u: >-
    📐 **U_wall (conduction only)** = {u:.2f} W/(m²·K)  |
    R = {r:.3f} m²·K/W  |  Total thickness = {esp:.1f} mm
  resumen_u_nota: >-
    Note: this U corresponds only to the wall conduction.
    The thermodynamic engine adds the interior and exterior convective
    films (h_int + R_wall + h_w) at each integration step.
bandejas:
  titulo_carros: Trolley and tray configuration
  titulo: Tray configuration
  n_carros:
    label: Number of trolleys
    help: >-
      Mobile trolleys with trays inside the chamber/tunnel.
      ADITAL: 24 trolleys. In semi-continuous it also defines the
      number of tunnel zones (1 trolley per zone).
  band_por_carro:
    label: Trays per trolley
    help: "Vertical tray stack of each trolley. ADITAL: ~14."
  bandejas_totales: "Total trays: **{n}** (= trolleys × trays/trolley)"
  n_bandejas: Number of trays
  area_bandeja: Area per tray [m²]
  espesor_capa:
    label: Product layer thickness [m]
    help: Thin-layer models valid for thickness ≤ 5 cm.
  separacion:
    label: Spacing between trays [m]
    help: Clear distance between the surfaces of consecutive trays.
  resumen: >-
    Stack height{sufijo}: {altura:.2f} m  |
    Total tray area: {area:.2f} m²  |
    Estimated load: {carga:.1f} kg/m²/tray
  sufijo_carro: " per trolley"
  perdida_titulo: "**Product pressure drop (cross-flow)**"
  k_rug_help: >-
    Blockage obstruction coefficient C_obs, applied as C·ρv²/2 over the
    channel between trays, to capture the form loss of the product bed in
    cross-flow (HORIZONTAL). It combines with the rough-wall friction
    (Colebrook with ε = product size), which captures the drag on the bed
    surface.

    **Automatic default** (improvement 29, general model): Borda-Carnot
    contraction + expansion with β = layer_thickness/spacing (fraction of
    the gap occupied by the product):
    • C_obs(β) = 0.5·[β/(1−β)] + [β/(1−β)]²
    • Grows with β and diverges when the gap blocks (β→1).

    In VERTICAL_ASCENDING this term does not apply: the Ergun equation
    already captures the through-bed resistance via Φ_s and d_p.
  forzar_k: Force C_obstruction (override the automatic default)
  c_obstruccion:
    label: C_obstruction [dimensionless]
    help: "Applied as C·ρv²/2 over the velocity of the channel between trays."
  k_auto: >-
    Automatically estimated C_obstruction: **{k:.2f}**
    (β = thickness/spacing = {beta:.2f}; bed roughness d_p = {dp:.1f} mm)
tunel:
  titulo: 🏭 Tunnel topology (semi-continuous)
  zonas_carros:
    label: Tunnel zones (= trolleys)
    help: >-
      Each tunnel zone holds exactly one trolley: the number of
      zones is set by the number of trolleys in the 'Trolleys and
      trays' section.
  n_zonas:
    label: Number of columns (zones in series)
    help: >-
      Columns of trolleys in series along the tunnel. The air flows
      counter-current: it enters hot through the dry column (zone N)
      and leaves humid through the fresh one (zone 1).
  cadencia:
    label: Advance cadence [h]
    help: >-
      How often a column advances one position. The dry column is
      unloaded and a fresh one enters. The outlet dryness is emergent
      (X_target is not forced).
  resumen: >-
    ⏱️ Total residence of a trolley: **{res:.1f} h** (≈ {dias:.1f} days)  |
    Load per column: **{carga:.1f} kg**  |
    One trolley unloaded every **{cadencia:.1f} h**.
flujo:
  titulo: Air flow
  hint_colector: "The collector delivers {q:.1f} L/s → ~{kg:.3f} kg/s (at ρ≈{rho:.2f} kg/m³)."
  seguir_colector:
    label: Take the collector's flow
    help: >-
      The system is sealed: what leaves the collector bank enters the chamber.
      With this on, the chamber flow follows the collector's and updates by
      itself when you change the bank or its design velocity. Turn it off if
      the collector air is mixed with ambient air before entering (for example
      to bring the inlet temperature down).
    desacoplado: >-
      ⚠️ The chamber flow is not the bank's. That is valid if there is mixing
      with ambient air; otherwise the collector will run off its design point.
  renovaciones:
    label: Air changes per minute [1/min]
    help: >-
      How many times per minute the chamber air volume is renewed. It is the
      way to size a passive dryer: asking for a flow rate in kg/s has no anchor
      when nothing imposes it. A box driven by thermal draft falls in **1–2 air
      changes/min**; the factory default in kg/s was equivalent to ~12, an order
      of magnitude too high, and made the P4 preview estimate half the drying
      time of P7.
    equivalencia: >-
      Equivalent to {m:.4f} kg/s (volume {V:.3f} m³ × ρ {rho:.3f} kg/m³ at the
      representative ambient temperature).
  caudal:
    label: Mass flow [kg/s]
    label_referencia: Reference mass flow [kg/s]
    help_default: Dry-air flow circulating through the chamber.
    help_referencia: >-
      With natural convection the flow rate is not an input: it is solved as the
      balance between thermal draft and the resistance of the circuit. This value
      is still used as the reference for scaling pressure losses and as a
      fallback during hours with no draft.
    caption_referencia: >-
      ℹ️ The actual flow rate is solved by the draft (see openings below). This
      number is only the scaling reference.
  direccion:
    label: Flow direction
    horizontal: HORIZONTAL
    vertical_ascendente: VERTICAL_ASCENDING
  usar_hr:
    label: Specify inlet RH
    help: If not specified, the calculation uses the scalar fallback from the catalogue.
  hr_entrada: RH of the air at the chamber inlet [%]
  velocidad: "Estimated superficial velocity: {v:.2f} m/s  |  Q_vol ≈ {q:.1f} L/s"
bocas:
  titulo: "**Air openings (natural convection)**"
  usar:
    label: The dryer has inlet and outlet openings
    help: >-
      This is sizing in both ways of moving the air, but the effect shows up in
      different places. With no fan, what moves the air is buoyancy: warm air in
      the chamber rises and leaves, and ambient air comes in below; the openings
      are the resistance of that circuit, so their size sets the flow rate. With
      a fan, the flow rate is imposed by the fan, but the openings set the
      pressure it must deliver and with it the electrical power you will see in
      P6.
  sin_bocas: >-
    With no openings defined, the calculation uses the fixed flow rate above
    ({caudal:.4f} kg/s) as if something sustained it. In a passive dryer it is
    worth defining them.
  sin_bocas_forzado: >-
    With no openings defined, P6 estimates the entry and exit losses from the
    duct velocity, i.e. assuming openings the size of the duct. Defining them
    refines the pressure the fan must deliver.
  con_motor: >-
    With a fan the flow rate does not change: the openings set the pressure it
    must deliver (and the electrical power). It shows in P6, under singular ΔP.
  acople_colector: >-
    The collector outlet and the inlet opening are assumed to have the **same
    cross-section**. If they do not, the coupling adds a contraction that this
    model does not represent yet.
  entrada:
    label: Inlet opening area [m²]
    help: Total free area through which ambient air enters (sum of all openings).
  salida:
    label: Outlet opening area [m²]
    help: >-
      Total free outlet area. It weighs more than the inlet: the leaving air
      carries away its kinetic energy, so throttling the outlet slows the
      circuit more than throttling the inlet.
  con_bocas: >-
    The flow rate is solved as the balance between thermal draft (the
    {alto:.2f} m column of the chamber) and the resistance of the openings.
  con_chimenea: >-
    With a chimney, the openings add resistance to the circuit: the draft
    column is the chamber plus the chimney. The outlet opening and the chimney
    base are assumed to have the **same cross-section**; the discharge to the
    atmosphere is counted once, at the top.
  caudal_resuelto: >-
    With these openings the balance gives ≈ {m5:.4f} kg/s at 5 K above ambient
    and ≈ {m15:.4f} kg/s at 15 K. The actual ΔT is set by the chamber balance;
    the definitive flow rate comes from P7.
  renovaciones_resueltas: >-
    In air changes: ≈ {r5:.2f} /min at 5 K and ≈ {r15:.2f} /min at 15 K. Use it
    to align the reference flow rate above with what the draft delivers.
borde:
  derivado_ambiente: >-
    With no collector, the air entering the chamber **is the ambient air**: T ≈
    {T:.1f} °C and RH ≈ {HR:.0f} %. There is nothing to heat it, so these are
    not configured ({origen}).
  hr_sin_clima: "Ambient RH with no climate loaded: {HR:.0f} % is used by default."
  titulo: Chamber inlet air (boundary condition)
  no_aplica: >-
    **Real day** mode active: the inlet air temperature and humidity come
    from the climate/collector, and the transport coefficients are
    recomputed over time. These values are not set in this mode.
  caption: >-
    These values describe the air that **enters** the chamber, not the
    temperature/RH **inside** it (which the engine computes and which vary
    over time). They are the boundary condition of the **Constants** and
    **Synthetic** modes.
  hint_t_caja: >-
    BOX typology: the incoming air is the ambient (no collector).
    Set T ≈ representative T_amb of the site.
  hint_t_otro: >-
    Temperature of the air entering the chamber. Typically ≈ collector
    outlet T. The T inside the chamber is a dynamic engine output.
  t_op: Inlet air temperature [°C]
  hr_op:
    label: Inlet air RH [%]
    help: >-
      Relative humidity of the air entering the chamber; it fixes its
      inlet absolute humidity ω. The RH inside the chamber is dynamic
      (thermodynamic-engine output). Not used in Real day mode: inlet ω
      comes from the climate.
forzantes:
  titulo: Air forcing and simulation horizon
  ventana_info: >-
    🗓️ **Production window**: the horizon is the span defined in
    P1 ({vi} → {vf}, {ndias} days) with real hourly climate (multi-day). {borde}
  ventana_borde_caja: T_inlet = T_amb(t) (the chamber acts as the collector).
  ventana_borde_otro: Forcing = collector hour by hour (day and night) + NASA POWER climate.
  ventana_sin_clima: >-
    ⚠️ The production window needs real climate loaded in
    **P2 · Site**.
  real_caja: Real day (ambient climate)
  real_otro: Real day (climate + collector)
  op_constantes: Constants (fast)
  op_sintetico: Synthetic day (sinusoidal)
  help_real_caja: >-
    **Real day:** hourly series of T_amb, ω, wind and I_g from the
    NASA POWER climate in P2 for the day selected in P1.
    T_inlet to the bed = T_amb (the chamber acts as the collector).
  help_real_otro: >-
    **Real day:** hourly collector series computed in P3 +
    NASA POWER climate from P2.
  radio:
    label: Inlet-air forcing
    help: >-
      **Constants:** T_in, ω and T_amb fixed at the design value.
      Equivalent to a single run.

      **Synthetic day:** day/night sinusoidal curve (midday peak,
      ±15 K in T_col_out, ±5 K in T_amb). Captures the diurnal cycle.

      {real}
  real_no_disp: "⚠️ Real day not available: {motivo} Falls back to 'Synthetic day'."
  hz:
    label: Drying horizon
    un_dia: 1 day
    multidia: Multi-day
    help: |
      1 day: 24 h of simulation. Multi-day: 24 h × N (1–21).

      Constants: defines the run's `t_max_s`.

      Synthetic/Real: defines how many typical days are replicated.
  n_dias: Number of days
  composicion:
    label: Horizon composition
    repetir: Repeat typical day
    consecutivos: Consecutive real days
    help: >-
      Repeat typical day: the design day is repeated N times
      (periodic forcing).

      Consecutive real days: N calendar days of NASA climate
      starting from the design day (real day-to-day variability).
      If the range crosses Dec 31 it is trimmed and warned.
  reales_caja: >-
    📅 Real forcing (BOX): T_inlet(t) = T_amb(t) and
    ω(t), v_wind(t) and I_g(t) from the NASA POWER climate in P2
    for the analysis day selected in P1.
  reales_otro: >-
    📅 Real forcing: T_col_out(t) from the P3 calculation,
    ω_amb(t), T_amb(t), v_wind(t) and I_g(t) from the NASA POWER climate in P2.
  i_g_max:
    label: Midday peak I_g [W/m²]
    help: >-
      Peak of global horizontal irradiance on the roof.
      Typical clear day: 800–1000 W/m². Daily curve: positive
      sinusoidal half-bell (sun between 6 h and 18 h).
  t_amb_repr: >-
    📍 Representative ambient T: **{t:.1f} °C** ({origen}). Used for
    wall losses and as the product's initial T if not explicitly defined.
  t_prod_check: Define the product's initial T explicitly (refrigerated, preheated, etc.)
  t_prod:
    label: Product initial T [°C]
    help: "Reasonable range: −10 °C (refrigerated) to +70 °C (preheated)."
  sin_gab: >-
    ⚠️ The selected product **has no calibrated GAB parameters**.
    The thermodynamic engine will use a non-physical fallback (linear ramp
    `a_w = X / X_initial`) that overestimates drying at low X. For reliable
    results, load GAB parameters into the catalogue or choose another product.
t_amb_origen:
  media_anual: "NASA POWER annual mean = {t:.1f} °C"
  fallback: "fallback 25 °C (no climate loaded)"
ventana_operacion:
  titulo: "### 🔁 Window operation"
  caption: >-
    In a batch production window the dryer reloads just like in the annual
    analysis, so it follows the same policy. The run is launched from the
    Results tab.
anual:
  sin_clima: ℹ️ **Annual analysis** available only with climate loaded in P2.
  clima_incompleto: >-
    ⚠️ The annual analysis needs all 12 months; the loaded climate covers
    {n_meses}. For partial campaigns use the Daily / Window modes.
  sin_colector: ⚠️ The annual analysis needs a collector configured in P3.
  titulo: "### ☀️ Annual analysis (8760 h)"
  caption: >-
    Simulates the whole year hour by hour with real climate: the dryer chains
    batches one after another, each taking however long it actually took. The
    number of batches is a **result**, not an input.
  recarga:
    titulo: 🔁 Reload policy
    caption: >-
      When the next batch is loaded after unloading the previous one. Without
      this the model reloads at the exact instant the batch ended — at 3 a.m. if
      that is when it happened — which no operator does.
    activa:
      label: Wait for the loading hour
      help: >-
        If disabled, the next batch starts as soon as the previous one ends, at
        any hour. That yields an upper bound on output, not an estimate.
    hora:
      label: Loading hour
      help: Local hour of the day when batches are loaded. Default 8:00.
    maniobra:
      label: Turnaround [h]
      help: >-
        Unloading + loading time. The next batch cannot start before the
        turnaround ends, and must also fall on the loading hour.
    aviso_cota: >-
      ⚠️ With no waiting, the dryer reloads at any hour (even overnight). The
      resulting output is an **upper bound**, not an estimate.
  pronostico:
    activo:
      label: Do not load on days with a bad forecast
      help: >-
        An operator does not fill the dryer on a day that looks cloudy: the
        batch drags on without finishing and keeps the chamber busy. If
        disabled, a batch is loaded on every day the dryer is free.
    umbral:
      label: Minimum daily irradiation [MJ/m²]
      help: >-
        Daily irradiation on the collector plane below which no batch is loaded
        and the dryer waits for the next day. Default 8 MJ/m²·day, the same
        threshold used to count operable days.
    nota_perfecto: >-
      ⓘ The decision uses the irradiation the day will actually get (perfect
      forecast): it is the upper bound of good decision-making.
  calcular:
    label: ☀️ Run full year
    help: >-
      Runs all 8760 h. The collector is evaluated with an interpolated response
      surface (same model, ~48× faster); takes about 20 s.
  spinner: Simulating the year hour by hour...
  exito: ✅ Year simulated. See the monthly breakdown in P7.
  error: "❌ {exc}"
  error_config: "❌ Invalid configuration: {exc}"
  error_calculo: "❌ Error in the annual calculation: {exc}"
  resumen: "**Year summary**"
  producto_seco:
    label: Dry product
    help: >-
      Mass of dried product unloaded during the year, at its target moisture.
      It is NOT the evaporated water — they are different quantities and both
      are shown.
  agua_evaporada:
    label: Evaporated water
    help: Total water removed from the product during the year.
  lotes:
    label: Completed batches
    frustrados: "{n} unfinished"
    help: >-
      Batches that reached the target moisture. Unfinished ones were loaded but
      never got there with the weather they got.
  duracion:
    label: Mean duration
    help: Mean drying time of the batches that completed.
  dias_salteados: >-
    ⓘ On {n} days the dryer was free and no batch was loaded because the day did
    not reach the irradiation threshold.
  cota_superior: >-
    ⓘ The model's operator decides with a **perfect forecast**: it knows the
    irradiation the loading day will actually get. Output is the upper bound of
    good decision-making.
error_config: "❌ Configuration error: {exc}"
advertencias_titulo: Design warnings
sin_advertencias: ✅ Design with no warnings.
presion_usada: "Atmospheric pressure used: {origen}."
horizonte_recortado: >-
  ⚠️ The horizon was trimmed to {n} day(s): the design day + {solicitado}
  days crosses the end of the climate year ({anio}). Choose an earlier start
  day (P1) or fewer days for the full horizon.
spinner_forzantes: Building the horizon forcings (collector hour by hour)...
spinner_integrando: Integrating the thermodynamic engine...
error_calculo: "❌ Calculation error: {exc}"
advertencias_calculo: Calculation warnings
test_puntual:
  titulo: "### Single-day spot test (optional)"
  caption: >-
    Lets you run a single batch with a synthetic or real day to
    validate the engine or explore one-day transients. It does **not**
    feed the annual results — those come from the 'Compute annual
    operation' button above.
calcular:
  aviso_previa_nodo_unico: >-
    ⚠️ **This preview solves the chamber as a single node** (well-mixed air), not
    as the N-zone counter-current tunnel. It is useful to see the order of
    magnitude of temperatures and of the drying curve with the real weather of
    the window, but it does **not** reproduce the longitudinal variation nor the
    emergent dryness of the discharged product. The full tunnel behaviour (zone
    profile, discharges per advance, production) is evaluated in **P7 · Results**,
    which is the source of truth.
  label: ⚙️ Compute chamber
  help_bloqueo: BOX typology requires at least one translucent face to be able to compute.
resultados_td:
  titulo: Thermodynamic-engine results
  t_secado: Drying time
  no_alcanzado: not reached
  status: Status
  agua_evaporada:
    label: Evaporated water
    help: Integral of ṁ_w(t) over the simulation.
  x_final:
    label: Final X
    help: Product moisture at the end of the integration.
  t_max:
    label: T_max product
    help: Maximum T_prod recorded along the trajectory.
  horas_anti_rehum:
    label: Anti-rewetting hours
    help: Time with policy B active (dX/dt clipped to 0).
  horas_hr:
    label: Hours RH > 95 %
    help: Time with chamber-air RH > 95 % (saturation risk).
  energia_rad:
    label: Direct radiative energy
    help: >-
      ∫ Q_rad(t) dt — direct solar gain to the product through
      the translucent roof. 0 in opaque chambers.
  no_convergio: >-
    ⚠️ In {dias:.1f} day(s) X_obj = {x_obj:.3f} kg/kg ds was not reached.
    Final moisture: {x_fin:.3f} kg/kg ds. Increase the horizon or improve
    the conditions.
  curva_expander: ℹ️ About the shape of the ṁ_w curve (diffusive model)
  curva_md: |
    The thermodynamic engine models evaporation as

    $$\dot m_w = K_m \cdot A_{prod} \cdot (\omega_{sup} - \omega_{flujo})$$

    with $\omega_{sup} = \omega_{sat}(T_{prod}) \cdot a_w(X_{prod})$.

    **Warming-up period:** at the start the product is colder than the air. ω_sat(T_prod) is small (it grows exponentially with T via Clausius-Clapeyron), so ω_sup ≈ ω_in and ṁ_w starts near zero. As T_prod rises, ω_sup grows fast and ṁ_w scales with it. This appears as a **rising initial ramp**, not the classic "constant rate from t=0" of empirical models (Lewis, Page).

    **Falling-rate period:** appears only when X crosses X_m (GAB monolayer moisture). Only then does a_w start to fall and drag ω_sup down. If your X_target > X_m, you finish drying before entering this zone and never see the drop.

    **Peak at the end of the run:** if the X_obj event fires near solar noon, T_prod (and hence ṁ_w) is at its maximum right when the integration cuts off. The last stored point coincides with the peak — it is not a plotting artefact.

    Empirical thin-layer models (Lewis/Page/etc.) **absorb the warming-up into the parameter k**, which is why they show MR falling from 1 from t=0. The diffusive engine models the energy balance explicitly — more realistic but the curve shape differs.
