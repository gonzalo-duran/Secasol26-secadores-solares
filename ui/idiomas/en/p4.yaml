validacion:
  titulo: 🔬 Validation against measured data
  intro: >-
    Compare the simulated chamber against your own test. The chamber runs
    ISOLATED, driven by the inlet air measured in the same file, so that the
    collector's error does not mix with the chamber's.
  aviso_orden: >-
    💡 It is best to validate AFTER running the full system in P7 (Results):
    the pre-design is then complete and you can also compare the full
    collector→chamber chain (the "🔗 Diagnostics" section below). Validating
    here early and stopping leaves the rest of the system unevaluated.
  sin_camara: Configure the chamber to enable validation.
  uploader:
    label: Chamber test file (CSV / Excel)
    help: >-
      A date/time column, the signal to validate (chamber T, RH, product T or
      moisture) and the inlet air (T and RH at the chamber inlet).
  archivo_cargado: "**{nombre}** ({kb} KB) loaded."
  quitar: Remove
  error: "Error processing the test: {err}"
  preview_titulo: File preview
  mapeo:
