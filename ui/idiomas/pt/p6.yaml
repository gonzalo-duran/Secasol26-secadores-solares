header: 6 · Motor / Ventilador
intro: >-
  O ar se move por **convecção forçada** (motor/ventilador) ou **natural**
  (chaminé solar, sem consumo elétrico). Forçada: maior controle da vazão e
  capacidade de vencer perdas de carga altas (leitos espessos, banco de
  coletores, escala industrial), ao custo de energia. Natural: sem eletricidade,
  vazão menor e variável com o sol e o vento — requer chaminé para induzir
  tiragem. Escolha com o botão abaixo.
cargar:
  titulo: 📥 Carregar configuração salva (.json)
  uploader: Envie um arquivo .json do motor salvo anteriormente
  error_reconstruccion: "❌ Erro reconstruindo o motor: {exc}"
  exito: ✅ Motor carregado do JSON ({n} valores da sessão foram reiniciados).
usar:
  label: Incorporar sistema de convecção forçada (motor / ventilador)
  help: >-
    Desative para tipologias de convecção natural
    (secador tipo caixa com chaminé, ou armário sem motor).
  sin_motor: >-
    Sem motor. O secador opera por convecção natural.
    Configure a chaminé solar abaixo para induzir tiragem térmica,
    ou ative o botão para dimensionar um ventilador.
accionamiento:
  titulo: Tipo de acionamento
  caption: >-
    Motor elétrico (ventilador axial ou centrífugo). Para convecção
    natural — eventualmente com extrator eólico no topo da chaminé
    — desative o motor no botão acima.
caudal:
  titulo: Vazão de projeto
  hint_colector: "Coletor (P3): {q:.1f} L/s"
  hint_camara: "Câmara (P4): {g:.1f} g/s → {l:.1f} L/s (a 50 °C)"
  label: Vazão volumétrica [L/s]
  help_default: Vazão que o ventilador deve mover.
  metric: Vazão
perdidas:
  titulo: Perdas de carga do sistema
  modo:
    label: Entrada de perdas de carga
    help: |
      **Por componentes:** estima ΔP_coletor (Darcy-Weisbach) e ΔP_câmara (resistência das bandejas) a partir de P3 e P4, mais 20% de margem de dutos.

      **ΔP total direto:** informe o valor medido em campo ou de catálogo.
    componentes: Por componentes (auto-estimado)
    total: ΔP total direto
  total:
    label: ΔP total do sistema [Pa]
    help: Inclui coletor, câmara e dutos.
  colector:
    label: ΔP coletor [Pa]
    help_auto: "Perda de carga no banco de coletores (Darcy-Weisbach). Auto (P3): {v:.1f} Pa."
    help_sin: Perda de carga no banco de coletores (Darcy-Weisbach). Configure P3 para auto-estimação.
    auto_caption: "Auto P3: **{v:.1f} Pa**"
  camara:
    label: ΔP câmara [Pa]
    help_auto: "Perda de carga nas bandejas da câmara. Auto (P4): {v:.1f} Pa (K_malha=2.0)."
    help_sin: Perda de carga nas bandejas da câmara. Configure P4 para auto-estimação.
    auto_caption: "Auto P4: **{v:.1f} Pa**"
  ductos:
    check: Especificar ΔP dutos
    label: ΔP dutos [Pa]
    auto_caption: "Auto 20%: **{v:.1f} Pa**"
  singulares:
    titulo: "ΔP singulares (entrada, saída, curvas, manifold, difusor): **{v:.1f} Pa**"
    v_label: Velocidade do ar no duto principal [m/s]
    v_help: >-
      Velocidade típica em dutos de secadores solares: 5–10 m/s.
      Mais alta → mais perda singular. Para dutos de ø≈15 cm com
      Q≈900 m³/h, v ≈ 14 m/s.
    detalle: |
      n_paralelo = {n_par} · n_curvas assumidas = 2 · coeficientes C de ASHRAE cap. 21 / Idelchik

      - Entrada (C=0.5): {entrada:.1f} Pa
      - Saída descarga livre (C=1.0): {salida:.1f} Pa
      - 2 curvas 90° (C=0.9 cada): {codos:.1f} Pa
      - Manifold banco→duto, confluência (C=1.5): {manifold:.1f} Pa
      - Difusor de entrada na câmara (C=0.3): {difusor:.1f} Pa
    bocas: >-
      ↳ **Bocas da câmara (P4): {dp:.1f} Pa** — entrada {a_in:.4f} m² / saída
      {a_out:.4f} m². Calculadas sobre a área real, substituem os termos de
      entrada, saída e difusor acima (que os estimam a partir da velocidade do
      duto, ou seja, supondo bocas do tamanho do duto).
  total_preview: >-
    **ΔP total estimada: {total:.1f} Pa** (col={col:.1f} + câm={cam:.1f} +
    dut={duc:.1f} + sing={sing:.1f})
  cano_caption: "↳ ΔP dutos inclui o **duto mestre** (P3): {v:.1f} Pa do manifold do banco."
