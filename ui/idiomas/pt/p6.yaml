chimenea:
  titulo: Chaminé solar
  cargar:
    titulo: 📥 Carregar configuração da chaminé (.json)
    uploader: Envie um arquivo .json da chaminé salvo anteriormente
    error_reconstruccion: "❌ Erro reconstruindo a chaminé: {exc}"
    exito: ✅ Chaminé carregada do JSON ({n} valores foram reiniciados).
  usar:
    label: Incorporar chaminé solar
    help: >-
      Uma chaminé gera tiragem térmica pela diferença de densidade entre
      o ar quente (câmara + chaminé) e o ambiente. Modelo em
      `calculos.chimenea_calc`.
  sin_chimenea: Sem chaminé. O ar se moverá apenas por difusão livre.
  diametro: Diâmetro interno [m]
  altura: Altura [m]
  material: Material
  extractor:
    check: Adicionar extrator eólico no topo
    check_help: >-
      Turbina passiva tipo 'chapéu chinês' montada no topo da chaminé.
      Adiciona um termo motriz ΔP = Cp·ρ·v_vento²/2 ao laço natural, onde
      v_vento é corrigido do valor NASA POWER (10 m) para a altura do topo
      via perfil logarítmico de camada limite. Também introduz uma
      resistência adicional Kt·ρ·v_fluxo²/2 ao fluxo ascendente.

      **Casos limite:**
      • v_vento = 0 (calmaria): a turbina só adiciona resistência → pior que chaminé nua.
      • Sem sol (noite/nublado): se há vento, a turbina segue movendo ar — robustez do sistema.
      • v_vento alto + sol: efeitos se somam, vazão maior.

      Sem correlação específica de literatura; as faixas de Cp e Kt são âncoras de ordem de grandeza (Idelchik / folhas técnicas de turbinas comerciais).
    titulo: Parâmetros do extrator eólico
    diam:
      label: Diâmetro do extrator [m]
      help: >-
        Diâmetro do orifício do extrator. Tamanhos comerciais
        típicos: 0.30 / 0.45 / 0.60 m. Recomendado ≥ ao
        diâmetro da chaminé para evitar estrangulamento.
    cp:
      label: Cp turbina [adim]
      help: >-
        Coeficiente de pressão motriz: ΔP_motriz = Cp·ρ·v² / 2.
        Faixa típica 0.3–0.6 para turbinas chapéu chinês.
        Valores mais altos só com dados de fabricante.
    kt:
      label: Kt turbina (resistência) [adim]
      help: >-
        Coeficiente resistivo: ΔP_resistência = Kt·ρ·v_fluxo²/2
        sobre a velocidade do ar no extrator.
        1.0 (padrão) cobre expansão + obstrução das pás.
    z0:
      label: Terreno (z₀)
      help: >-
        Comprimento de rugosidade aerodinâmica do terreno. Usado para
        corrigir o vento do sítio (a 2 m) para a altura do topo da
        chaminé via perfil logarítmico v(z) = v(2)·ln(z/z₀)/ln(2/z₀).
        É uma propriedade do sítio: define-se uma vez em P2 →
        Localização e é compartilhada pela chaminé e pela ingestão de
        clima medido.
      origen: 📍 {terreno} — definido em P2 → Localização.
    preview_viento: >-
      Vento médio do sítio (P2, a 2 m): **{vref:.1f} m/s** → corrigido
      a {z:.1f} m do topo: **{vloc:.2f} m/s** → ΔP motriz turbina
      (a T_amb 20 °C): **{dp:.2f} Pa**.
    preview_sin_clima: >-
      Carregue dados de clima em P2 para pré-visualizar o efeito
      do vento na altura do topo da chaminé.
  error_validacion: "**Erro de validação** — {err}"
  tiro:
    titulo: "**Tiragem térmica estimada** (câmara + chaminé como coluna ascendente)"
    metric_dt: ΔT = +{dt:.0f} K
    caption: >-
      Cálculo informativo com T_amb=20 °C, H_efetiva = altura_chaminé
      ({alt:.1f} m) + altura_câmara ({hcam:.2f} m) = {heff:.2f} m. A vazão
      de equilíbrio é resolvida em `balance_global` com T_chim do laço e
      perdas reais.
  guardar:
    txt: Salvar configuração da chaminé (.txt)
    json: Salvar configuração da chaminé (.json)
  calcular:
    falta_camara: >-
      ⚠️ Configure a câmara (P4) antes de avaliar a chaminé — sua
      vazão de projeto e ΔP são entradas do laço natural.
    boton: 🌪️ Calcular chaminé
    spinner: Resolvendo laço natural pela chaminé...
    error_calculo: "❌ Erro no cálculo: {exc}"
    prompt: >-
      Pressione **Calcular chaminé** para resolver o laço natural com
      condições representativas. O resultado fica persistido e é
      mostrado em P7 como seção avaliada.
    titulo: Resultados do laço natural
    caudal_natural:
      label: Vazão natural
      help: ṁ de equilíbrio do laço (câmara + coletor + chaminé).
    v_chim:
      label: v na chaminé
      help: Velocidade média na seção da chaminé.
    re:
      label: Re chaminé
      help: "Re > 4000: turbulento. Re < 2300: laminar."
    dp_tiro:
      label: ΔP tiragem térmica
      help: Empuxo hidrostático = g·H_eff·(ρ_amb − ρ_chim).
    dp_ducto:
      label: ΔP duto chaminé
      help: Atrito + singulares do duto da chaminé.
    dp_resto:
      label: ΔP resto (col+câm)
      help: ΔP de coletor + câmara escalado quadraticamente à vazão de equilíbrio.
    dp_turbina:
      label: ΔP motriz turbina
      help: "Extrator eólico a v_local={v:.2f} m/s."
    h_eff: H efetiva
    advertencias: "⚠️ {n} advertência(s) do laço natural"
    inputs: >-
      Entradas: T_amb={t_amb:.1f} °C, T_chim={t_chim:.1f} °C
      (heurística ΔT={dt:.0f} K para {tipo}), v_vento={v:.1f} m/s,
      P={p:.2f} kPa. Clima: {clima}. Pressão: {presion}.
      Em P7 é resolvido novamente com o laço Picard completo (o T_chim da
      câmara realimenta o cálculo).
    tipo_caja: CAIXA
    tipo_otro: ARMÁRIO/GRANDE-ESCALA
condiciones:
  media_anual: média anual NASA POWER (P2)
  fallback: fallback (T=20 °C, v=2 m/s)
