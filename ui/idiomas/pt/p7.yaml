  forzantes: Forçantes
  caption: >-
    As forçantes T_amb(t), T_sal_col(t), v_vento(t), I_g(t), ω(t) vêm de P4
    exatamente como você simulou. Se você configurou um **Auxiliar (P5)**,
    ele é aplicado passo a passo à T_ent da câmara antes de rodar de novo o
    motor termodinâmico.
  boton: ▶ Calcular pipeline transitória
  spinner: Rodando auxiliar(t) + câmara TD + ventilador...
  prompt: ℹ️ Pressione **Calcular** para avaliar a pipeline transitória.
