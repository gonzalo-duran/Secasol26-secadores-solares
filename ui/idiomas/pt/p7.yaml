carta:
  titulo: Carta psicrométrica do processo
  caption: >-
    Estados do ar úmido ao longo do processo, corrigidos à pressão do local.
    O aquecimento no coletor e auxiliar é **sensível** (ω constante → trechos
    horizontais); na câmara o ar **ganha umidade**. A isentálpica pontilhada é
    a referência adiabática desde a entrada da câmara: se a saída cai sobre
    ela a secagem foi ≈ adiabática (câmara indireta); acima, houve aporte de
    calor (câmara direta com teto translúcido). Em modos com evolução temporal
    o estado mostrado é o de máxima irradiância (≈ meio-dia solar).
sin_camara: >-
  ⚠️ Para calcular resultados é necessário configurar ao menos a
  **Câmara de Secagem (P4)**.
anual_prompt_detalle: Cálculo de um dia representativo (contexto adicional)
anual_prompt_detalle_cap: >-
  Abaixo aparece o cálculo de um único dia (constantes ou transitório).
  É útil para validar o motor ou explorar transitórios — os resultados
  anuais que importam estão acima. Se não quiser vê-lo, ignore esta seção.
anual_sin_calcular: >-
  📅 **Modo ANUAL ativado.** Para ver os resultados mensais e agregados
  anuais, vá a **P4** e aperte o botão '📅 Calcular operação anual'.
  Enquanto isso, mostra-se o cálculo de um dia representativo.
modo:
  titulo: Modo de cálculo
  label: Como avaliamos o pré-dimensionamento completo?
  transitorio: Transitório (horizonte de P4)
  constantes: Constantes representativas
  help: |
    Transitório: usa as forçantes horárias com que você rodou o motor termodinâmico da câmara (P4), soma o auxiliar passo a passo e reporta resultados integrados sobre o horizonte.

    Constantes: condições representativas escalares — um único ponto de projeto.
  sin_horizonte: >-
    ℹ️ Para ativar o **modo transitório** rode primeiro a câmara em P4 com
    forçantes 'Dia sintético' ou 'Dia real'. O horizonte se propaga
    automaticamente aqui.
horizonte:
