    tab_a: 9a · T saída vs mês
    tab_b: 9b · Perfil T fluido por mês
    caption_mediodia: Avaliação no meio-dia solar do dia 15 de cada mês.
    sin_resultados: Não foram obtidos resultados válidos. Verifique se o clima tem radiação suficiente.
campo:
  titulo: Avaliação do campo de coletores
  intro: >-
    Rede hidráulica do **banco + duto mestre** (metodologia ASHRAE
    cap. 21: atrito Darcy-Weisbach por trecho + perdas singulares
    de boca): distribuição real de vazão entre ramais, temperatura de
    saída de cada ramal na sua própria vazão, mistura no manifold e
    T do fluxo na saída do duto mestre.
  origen_p4: a vazão do sistema configurada em P4 (vazão única S41)
  origen_banco: a vazão de projeto do banco (não há câmara configurada)
  q:
    label: Vazão total [L/s]
    help: "Vazão movida pelo ventilador. Padrão: {origen}."
  t_amb: T ambiente [°C]
  poa:
    label: POA [W/m²]
    help: Irradiância sobre o plano do coletor (ponto de operação representativo).
  viento: Vento [m/s]
  boton: Avaliar campo de coletores
  spinner: Resolvendo rede hidráulica + térmica de {n} ramais...
  t_salida_cano: T saída do duto mestre
  delta_cano: "{v:+.1f} K no duto"
  t_mezcla: T de mistura do banco
  desuniformidad:
    label: Desuniformidade de distribuição
    help: (q_máx − q_mín) / q_médio. Abaixo de 10 % considera-se boa distribuição.
  dp_sistema:
    label: ΔP do sistema (campo)
    help: "ΔP de trajetória equilibrada: ramal + tronco do duto mestre."
  dp_troncal:
    label: ΔP do tronco do duto
    help: >-
      Perda apenas do manifold (boca 1 distante → ventilador),
      isolada do ramal. É o que responde à compensação
      de seção do duto.
  v_troncal:
    label: v troncal (mín → máx)
    help: >-
      Velocidade do ar ao longo do duto (extremo distante →
      ventilador). Uma seção crescente a mantém limitada ao
      acumular vazão; uma seção pequena constante a dispara
      perto do ventilador.
  convergio: convergiu
  no_convergio: "**não convergiu**"
  caption_reparto: >-
    Distribuição resolvida em {n} iterações ({estado}).
    q por ramal: {qmin:.1f} – {qmax:.1f} L/s.
