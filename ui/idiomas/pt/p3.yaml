  ventana:
    t_max: T saída máx (janela)
    dt_medio: ΔT médio diurno (POA > 50)
    horas_40: Horas com T saída > 40 °C
    tab_series: Séries sobre a janela
    tab_perfil: Perfil T fluido (meio-dia, 1º dia)
    caption_series: >-
      Séries horárias de **dia e noite** (à noite o ar não se
      aquece → T_saída ≈ T_amb). Marcas: POA máx (◆) e meio-dia
      solar (▲) de cada dia.
    perfil_label: primeiro dia de {lapso}
    caption_perfil: >-
      ⚠️ Este gráfico representa **apenas o meio-dia solar do
      primeiro dia** da janela de produção.
    sin_radiacion: >-
      Não há radiação suficiente ao meio-dia do primeiro dia para
      calcular o perfil T(x).
    caption_vista_previa: >-
      Prévia à **velocidade de projeto** do módulo. O cálculo de
      produção (P7) roda o coletor novamente na vazão real imposta pelo
      ventilador do sistema.
  anual:
    t_max_mes: T saída máx (melhor mês)
    t_min_mes: T saída mín (pior mês)
