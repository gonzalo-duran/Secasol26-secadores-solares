  titulo: Avaliação do desempenho do coletor
  falta_emplazamiento: Configure o local (P2) para habilitar a avaliação.
  falta_clima: Baixe os dados climáticos (P2) para habilitar a avaliação.
  modo:
    diario: Diário
    ventana: Janela de produção
    anual: Anual
  modo_caption: >-
    Modo de análise: **{modo}** (configurado em P1)  |
    Inclinação: {pend:.0f}°  |  Ano climático: {anio}
  albedo:
    label: Albedo do solo (superfície circundante)
    help: >-
      Refletância solar do solo ao redor do coletor. Alimenta a
      componente refletida da POA (GHI·ρ·(1−cos β)/2). Seu efeito cresce
      com a inclinação: em um coletor vertical, metade de GHI·ρ
      chega ao plano do coletor.
    personalizado: ρ personalizado
  boton: Calcular desempenho do coletor
  sin_datos_dia: Não há dados para o dia {fecha} no arquivo climático.
  spinner_dia: Avaliando coletor para {fecha}...
  spinner_ventana: Avaliando coletor sobre a janela ({horas} horas)...
  spinner_anual: Avaliando coletor para os 12 meses representativos...
  ventana_error: "Não foi possível recortar a janela: {msg}"
  resultados_titulo: "#### Resultados da avaliação"
  diario:
    t_max: T saída máx (dia)
    t_mediodia: T saída ao meio-dia
    dt_max: ΔT máx (saída − ambiente)
    tab_a: 9a · T saída vs hora
    tab_b: 9b · Perfil T fluido ao meio-dia
