  exito: ✅ Câmara carregada do JSON ({n} valores da sessão foram reiniciados).
producto:
  titulo: Produto a secar
  sin_productos: >-
    Não foram encontrados produtos com modelos de camada fina calibrados no catálogo.
    Verifique os arquivos em catalogo/productos/.
  label: Produto
  help: >-
    Produto a secar. Ao escolhê-lo, carregam-se sua isoterma de sorção (GAB),
    propriedades básicas e umidade de equilíbrio, que alimentam o balanço
    acoplado calor-massa da câmara. Só aparecem produtos com dados calibrados
    no catálogo; se faltar o seu, é preciso calibrá-lo antes de usá-lo.
  x_ini:
    label: Umidade inicial X₀ [kg água / kg ms]
    help: "Base seca. Tipicamente 4–16 kg/kg ms para frutas e hortaliças frescas."
  x_obj:
    label: Umidade objetivo X_obj [kg água / kg ms]
    help: >-
      Umidade final desejada em base seca.
      Valores típicos de armazenamento: 0.10–0.20 kg/kg ms.
  masa: Massa total a secar [kg]
  gab_ok: ✅ Isoterma GAB calibrada disponível.
  gab_fallback: "⚠️ Sem isoterma GAB. Será usado X_eq = {x:.3f} kg/kg ms (fallback)."
geometria:
  titulo: Geometria da câmara
  esquema_titulo: 📐 Esquema da câmara
  esquema_caption: Esquema da câmara de secagem com suas dimensões principais.
  largo: Comprimento [m]
  ancho: Largura [m]
  alto: Altura [m]
  volumen: "Volume interno: {vol:.3f} m³  |  Área de planta: {area:.3f} m²"
  orientacion_titulo: "**Orientação e teto de uma água**"
  orientacion_caption: >-
    A câmara tem sua própria orientação (independente da do banco
    de coletores em P2). O teto é de uma água: cai desde a altura maior
    até a altura menor na face escolhida.
  pendiente_techo:
    label: Inclinação do teto [°]
    help: "0° = teto plano (histórico, sem mudanças no balanço)."
  acimut:
    label: Azimute da câmara [°] — 0°=Sul, 90°=Leste, 180°=Norte, 270°=Oeste
    help: Azimute da normal exterior da face 'frente' (mesma convenção que P2).
  cara_caida:
    label: Face de caída do teto
    help: >-
      Face para a qual o teto cai (a de menor altura).
      Esquerda/direita olhando na direção do fluxo (de trás para a frente).
    frente: Frente
    atras: Atrás
    lateral_izq: Lateral esquerda
    lateral_der: Lateral direita
  preview_techo: >-
    Altura menor: {menor:.2f} m  |  Altura maior: {mayor:.2f} m  |
    Área real do teto: {area:.3f} m²  |  Azimute pvlib: {pvlib:.1f}°
vidriado:
  opaca: (opaca — sem radiação ao produto)
  material:
    label: Material do vidraçado
    help: >-
      Opaca: câmara fechada ao sol (secador indireto puro).
      Material translúcido: mesmo material e espessura para todas as
      faces marcadas abaixo; cada uma introduz radiação no produto
      e no ar segundo sua própria orientação
      (ver calculos/radiacion_camara.py).

      **CAIXA**: obrigatoriamente translúcida (ao menos uma face), a
      radiação é a única fonte de energia sem coletor externo.
  tau: "τ_solar = {v:.2f} (do catálogo)"
  espesor: Espessura do vidraçado [mm]
  k_efectivo: "k_efetivo = {v:.3f} W/(m·K) (do catálogo)"
  caras_titulo: "**Superfícies translúcidas**"
  caras_caption: >-
    Faces que levam o vidraçado escolhido (mesmo material/espessura em
    todas). O piso é sempre opaco. Padrão: só teto (comportamento histórico).
  cara_techo: Teto
  cara_frente: Frente
  cara_atras: Atrás
  cara_lat_izq: Lat. esq.
  cara_lat_der: Lat. dir.
  sin_caras: >-
    ⚠️ Nenhuma face está ativa: a câmara fica termicamente opaca
    (sem ganho radiativo) mesmo com o material definido.
  caja_sin_caras: >-
    ❌ Tipologia CAIXA requer ao menos uma face translúcida.
    Sem coletor externo, a radiação é a única fonte de energia.
  caja_sin_techo: >-
    ❌ Tipologia CAIXA requer teto translúcido. Sem coletor externo
    e com cobertura opaca, o secador não recebe nenhuma energia.
  preview:
    cara: Face
    area: Área [m²]
    inclinacion: Inclinação [°]
    acimut: Azimute UI360 [°]
    translucida: Translúcida
materiales:
  titulo: "**Materiais da câmara**"
  caption: >-
    A composição escolhida se aplica a paredes laterais, piso e teto
    (exceto quando o teto é translúcido, caso em que este é tratado
    à parte acima).
  tipo_pared:
    label: Tipo de parede
    simple: Simples (1 material + espessura)
    compuesta: Composta (face externa + isolante + face interna)
    help: >-
      Simples: uma única camada estrutural.
      Composta: face externa + isolante + face interna,
      resistências térmicas em série.
  catalogo:
    label: Catálogo
    help: "fondos = chapa/madeira estrutural; aislantes = lã, EPS, PUR."
  material: Material
  material_estructural: Material (estrutural)
  material_aislante: Material (isolante)
  espesor_mm: Espessura [mm]
  cara_externa: "**Face externa**"
  espesor_externa: Espessura externa [mm]
  aislante: "**Isolante**"
  espesor_aislante: Espessura isolante [mm]
  cara_interna: "**Face interna**"
  espesor_interna: Espessura interna [mm]
  resumen_u: >-
    📐 **U_parede (só condução)** = {u:.2f} W/(m²·K)  |
    R = {r:.3f} m²·K/W  |  Espessura total = {esp:.1f} mm
  resumen_u_nota: >-
    Nota: este U corresponde apenas à condução da parede.
    O motor termodinâmico soma os filmes convectivos interior e
    exterior (h_int + R_parede + h_w) em cada passo de integração.
bandejas:
  titulo_carros: Configuração de carros e bandejas
  titulo: Configuração de bandejas
  n_carros:
    label: Número de carros
    help: >-
      Carros móveis com bandejas dentro da câmara/túnel.
      ADITAL: 24 carros. Em semicontínuo define também o
      número de zonas do túnel (1 carro por zona).
  band_por_carro:
    label: Bandejas por carro
    help: "Pilha vertical de bandejas de cada carro. ADITAL: ~14."
  bandejas_totales: "Bandejas totais: **{n}** (= carros × bandejas/carro)"
  n_bandejas: Número de bandejas
  area_bandeja: Área por bandeja [m²]
  espesor_capa:
    label: Espessura da camada de produto [m]
    help: Modelos de camada fina válidos para espessura ≤ 5 cm.
  separacion:
    label: Separação entre bandejas [m]
    help: Distância livre entre superfícies de bandejas consecutivas.
  resumen: >-
    Altura da pilha{sufijo}: {altura:.2f} m  |
    Área total de bandeja: {area:.2f} m²  |
    Carga estimada: {carga:.1f} kg/m²/bandeja
  sufijo_carro: " por carro"
  perdida_titulo: "**Perda de carga pelo produto (cross-flow)**"
  k_rug_help: >-
    Coeficiente de obstrução por bloqueio C_obs, aplicado como C·ρv²/2
    sobre o canal entre bandejas, para capturar a perda de forma do
    leito de produto em cross-flow (HORIZONTAL). Combina-se com o
    atrito de parede rugosa (Colebrook com ε = tamanho do produto), que
    captura o atrito sobre a superfície do leito.

    **Padrão automático** (melhoria 29, modelo geral): contração +
    expansão Borda-Carnot com β = espessura_camada/separação (fração do
    gap ocupada pelo produto):
    • C_obs(β) = 0.5·[β/(1−β)] + [β/(1−β)]²
    • Cresce com β e diverge quando o gap se bloqueia (β→1).

    Em VERTICAL_ASCENDENTE este termo não se aplica: a equação de Ergun
    já captura a resistência do leito atravessado via Φ_s e d_p.
  forzar_k: Forçar C_obstrução (override do padrão automático)
  c_obstruccion:
    label: C_obstrução [adim]
    help: "Aplica-se como C·ρv²/2 sobre a velocidade do canal entre bandejas."
  k_auto: >-
    C_obstrução estimado automaticamente: **{k:.2f}**
    (β = espessura/separação = {beta:.2f}; rugosidade do leito d_p = {dp:.1f} mm)
tunel:
  titulo: 🏭 Topologia do túnel (semicontínuo)
  zonas_carros:
    label: Zonas do túnel (= carros)
    help: >-
      Cada zona do túnel aloja exatamente um carro: o número de
      zonas fica definido pelo número de carros da seção 'Carros e
      bandejas'.
  n_zonas:
    label: Número de colunas (zonas em série)
    help: >-
      Colunas de carros em série ao longo do túnel. O ar circula
      em contracorrente: entra quente pela coluna seca (zona N) e
      sai úmido pela fresca (zona 1).
  cadencia:
    label: Cadência de avanço [h]
    help: >-
      A cada quantas horas uma coluna avança uma posição. A coluna
      seca é descarregada e entra uma fresca. A secura de saída é
      emergente (não se força X_objetivo).
  resumen: >-
    ⏱️ Residência total de um carro: **{res:.1f} h** (≈ {dias:.1f} dias)  |
    Carga por coluna: **{carga:.1f} kg**  |
    Um carro descarregado a cada **{cadencia:.1f} h**.
