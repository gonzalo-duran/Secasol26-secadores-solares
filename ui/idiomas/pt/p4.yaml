  hz:
    label: Horizonte de secagem
    un_dia: 1 dia
    multidia: Multidia
    help: |
      1 dia: 24 h de simulação. Multidia: 24 h × N (1–21).

      Constantes: define o `t_max_s` da corrida.

      Sintético/Real: define quantos dias tipo se replicam.
