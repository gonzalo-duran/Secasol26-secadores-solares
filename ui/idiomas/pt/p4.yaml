borde:
  titulo: Ar de entrada na câmara (condição de contorno)
  no_aplica: >-
    Modo **Dia real** ativo: a temperatura e a umidade do ar de entrada
    saem do clima/coletor, e os coeficientes de transporte são recalculados
    no tempo. Estes valores não se configuram neste modo.
  caption: >-
    Estes valores descrevem o ar que **entra** na câmara, não a
    temperatura/UR **dentro** dela (que o motor calcula e variam no
    tempo). São a condição de contorno dos modos **Constantes** e
    **Sintético**.
  hint_t_caja: >-
    Tipologia CAIXA: o ar entrante é o ambiente (sem coletor).
    Configurar T ≈ T_amb representativa do local.
  hint_t_otro: >-
    Temperatura do ar que entra na câmara. Tipicamente ≈ T_saída
    do coletor. A T dentro da câmara é uma saída dinâmica do motor.
  t_op: Temperatura do ar de entrada [°C]
  hr_op:
    label: UR do ar de entrada [%]
    help: >-
      Umidade relativa do ar que entra na câmara; fixa sua umidade
      absoluta ω de entrada. A UR dentro da câmara é dinâmica (saída
      do motor termodinâmico). No modo Dia real não se usa: ω de entrada
      sai do clima.
