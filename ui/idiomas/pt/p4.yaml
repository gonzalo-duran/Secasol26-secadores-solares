header: 4 · Câmara de Secagem
info_caja: >-
  📦 **Tipologia CAIXA**: a câmara atua como secador direto.
  O teto translúcido é obrigatório (única fonte de energia)
  e a temperatura de operação é a do ar ambiente.
info_semicontinuo: >-
  🏭 **Grande escala — Semicontínuo (túnel em contracorrente)**: a carga
  total e a geometria abaixo se distribuem em N colunas em série; o ar
  entra quente pela coluna seca e sai úmido pela fresca.
  Configure a topologia do túnel na sua seção.
cargar:
  titulo: 📥 Carregar configuração salva (.json)
  uploader: Envie um arquivo .json da câmara salvo anteriormente
