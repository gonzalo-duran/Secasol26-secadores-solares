resultados_td:
  titulo: Resultados do motor termodinâmico
  t_secado: Tempo de secagem
  no_alcanzado: não alcançado
  status: Status
  agua_evaporada:
    label: Água evaporada
    help: Integral de ṁ_w(t) sobre a simulação.
  x_final:
    label: X final
    help: Umidade do produto ao final da integração.
  t_max:
    label: T_max produto
    help: Máxima T_prod registrada na trajetória.
  horas_anti_rehum:
    label: Horas anti-reumectação
    help: Tempo com política B ativa (dX/dt clipado a 0).
  horas_hr:
    label: Horas UR > 95 %
    help: Tempo com UR do ar na câmara > 95 % (risco de saturação).
  energia_rad:
    label: Energia radiativa direta
    help: >-
      ∫ Q_rad(t) dt — aporte solar direto ao produto através
      do teto translúcido. 0 em câmaras opacas.
  no_convergio: >-
    ⚠️ Em {dias:.1f} dia(s) X_obj = {x_obj:.3f} kg/kg ms não foi alcançado.
    Umidade final: {x_fin:.3f} kg/kg ms. Aumente o horizonte ou melhore
    as condições.
  curva_expander: ℹ️ Sobre a forma da curva de ṁ_w (modelo difusivo)
  curva_md: |
    O motor termodinâmico modela a evaporação como

    $$\dot m_w = K_m \cdot A_{prod} \cdot (\omega_{sup} - \omega_{flujo})$$

    com $\omega_{sup} = \omega_{sat}(T_{prod}) \cdot a_w(X_{prod})$.

    **Período de aquecimento (warming-up):** no início o produto está mais frio que o ar. ω_sat(T_prod) é pequena (cresce exponencialmente com T por Clausius-Clapeyron), então ω_sup ≈ ω_ent e ṁ_w começa perto de zero. À medida que T_prod sobe, ω_sup cresce rápido e ṁ_w escala com ele. Isto aparece como uma **rampa inicial crescente**, não como o clássico "velocidade constante desde t=0" dos modelos empíricos (Lewis, Page).

    **Período de velocidade decrescente:** aparece só quando X cruza X_m (umidade de monocamada GAB). Só aí a_w começa a cair e arrasta ω_sup para baixo. Se seu X_objetivo > X_m, você termina a secagem antes de entrar nesta zona e nunca vê a queda.

    **Pico ao final da corrida:** se o evento X_obj dispara perto do meio-dia solar, T_prod (e portanto ṁ_w) está no seu máximo justo quando a integração é cortada. O último ponto guardado coincide com o pico — não é um artefato de plotagem.

    Os modelos empíricos de camada fina (Lewis/Page/etc.) **absorvem o warming-up dentro do parâmetro k**, por isso mostram MR caindo desde 1 a partir de t=0. O motor difusivo modela o balanço de energia explicitamente — é mais realista mas a forma da curva difere.
resultados_cf:
