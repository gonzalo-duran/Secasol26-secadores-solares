    O modelo supõe ar bem misturado (um nó): um sensor perto da entrada lê mais
    quente que a média e um perto da saída, mais frio. Parte do resíduo pode ser
    posição do sensor, não erro do modelo.
calibracion:
  titulo: "**🎯 Calibração do modelo de câmara**"
  intro: >-
    Varra um coeficiente de transporte e fique com o valor que melhor ajusta a
    simulação ao medido. O resultado é um diagnóstico: quanto o modelo se afasta
    do medido e em que direção.
  parametro: Coeficiente a calibrar
  param:
    area_bandeja: Área efetiva de troca [m²]
    factor_K_m: Fator sobre K_m (transferência de massa)
    factor_h_conv: Fator sobre h_conv (convecção interna)
  ayuda_param: >-
    K_m governa a velocidade de evaporação; h_conv arrasta K_m por
    Chilton-Colburn, portanto também muda o calor sensível.
  min: Mínimo
  max: Máximo
  n: N.º de pontos
  objetivo: Função objetivo
  obj:
    rmse: RMSE
    mbe_abs: "|MBE|"
    mae: MAE
  rango_invalido: O máximo deve ser maior que o mínimo.
  correr: Calibrar
  spinner: Varrendo o coeficiente e ajustando contra o medido…
  sin_optimo: Nenhum ponto da varredura foi avaliável (revise o intervalo ou a sobreposição temporal).
  grafica_titulo: Função objetivo vs coeficiente
  eje_x: Fator multiplicativo
  optimo: Ótimo
  resultado: "Ótimo: fator {valor} → RMSE {rmse}, MBE {mbe}, R² {r2}."
  lectura_alto: >-
    Um fator maior que 1 significa que o modelo **subestima** o transporte: a
    câmara real seca mais rápido do que o previsto.
  lectura_bajo: >-
    Um fator menor que 1 significa que o modelo **superestima** o transporte: a
    câmara real seca mais devagar do que o previsto.
  lectura_neutro: O modelo reproduz o ensaio sem correção apreciável.
  aviso_hr: >-
    Atenção: a UR de entrada não foi medida. Um erro na umidade de entrada é
    absorvido por este fator, portanto o valor calibrado pode estar compensando a
    suposição e não um defeito do modelo.
  es_aplicable: "Este parâmetro **é um campo do projeto**: o valor ótimo pode ser aplicado à câmara."
  es_diagnostico: >-
    Este coeficiente é um **diagnóstico do modelo**, não uma propriedade da câmara: não é salvo no projeto, porque o que ele absorve (analogia de Chilton-Colburn, isoterma da cultivar, umidade de entrada suposta) não transfere para outro produto nem para outra vazão.
  lectura_area: >-
    A área efetiva de troca ajustada é **{veces}×** a da bandeja declarada. Para uma camada de fatias empilhadas, um valor acima de 1 é esperado.
  aplicar: "Aplicar o valor ótimo à câmara"
  aplicado: "Valor ótimo aplicado à câmara. Recalcule a secagem acima."
cadena:
  titulo: "**🔗 Diagnóstico da cadeia completa**"
  intro: >-
    Além da câmara isolada, compare o medido com o resultado do sistema completo
    (coletor → auxiliar → câmara) calculado em P7. Não é possível calibrar sobre
    ele: o resíduo mistura o erro de todos os elos.
  sin_resultado: Calcule o transitório em P7 para habilitar esta comparação.
  sin_ancla: >-
    O resultado de P7 não tem data associada (forçantes sintéticas). Rode o
    transitório com clima real para poder alinhá-lo com o medido.
  sin_solape: O período do medido não se sobrepõe ao horizonte calculado em P7.
  grafica_titulo: "{magnitud} — medido vs cadeia completa (P7)"
  simulado: Simulado (cadeia P7)
  metricas: "Cadeia completa: RMSE {rmse}, MBE {mbe}, R² {r2} sobre {n} pares."
  comparacion: >-
    Se a cadeia ajusta pior que a câmara isolada, o erro extra vem dos elos a
    montante (coletor, duto, auxiliar) ou do clima, não da câmara.
