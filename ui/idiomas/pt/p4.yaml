    **Dia real:** série horária de T_amb, ω, vento e I_g do
    clima NASA POWER de P2 para o dia selecionado em P1.
    T_entrada ao leito = T_amb (a câmara atua como coletor).
  help_real_otro: >-
    **Dia real:** série horária do coletor calculada em P3 +
    clima NASA POWER de P2.
  radio:
    label: Forçantes do ar de entrada
    help: >-
      **Constantes:** T_ent, ω e T_amb fixos no valor de projeto.
      Equivale a uma corrida pontual.

      **Dia sintético:** curva senoidal dia/noite (pico ao meio-dia,
      ±15 K em T_sal_col, ±5 K em T_amb). Captura o ciclo diurno.

      {real}
  real_no_disp: "⚠️ Dia real não disponível: {motivo} Cai para 'Dia sintético'."
  hz:
    label: Horizonte de secagem
    un_dia: 1 dia
    multidia: Multidia
    help: |
      1 dia: 24 h de simulação. Multidia: 24 h × N (1–21).

      Constantes: define o `t_max_s` da corrida.

      Sintético/Real: define quantos dias tipo se replicam.
  n_dias: Número de dias
  composicion:
    label: Composição do horizonte
    repetir: Repetir dia típico
    consecutivos: Dias reais consecutivos
    help: >-
      Repetir dia típico: o dia de projeto se repete N vezes
      (forçante periódico).

      Dias reais consecutivos: N dias calendário do clima NASA
      a partir do dia de projeto (variabilidade real dia a dia).
      Se o intervalo cruza 31-dez é recortado e avisado.
  reales_caja: >-
    📅 Forçantes reais (CAIXA): T_entrada(t) = T_amb(t) e
    ω(t), v_vento(t) e I_g(t) do clima NASA POWER de P2
    para o dia de análise selecionado em P1.
  reales_otro: >-
    📅 Forçantes reais: T_sal_col(t) do cálculo P3,
    ω_amb(t), T_amb(t), v_vento(t) e I_g(t) do clima NASA POWER de P2.
  i_g_max:
    label: I_g pico ao meio-dia [W/m²]
    help: >-
      Pico de irradiância global horizontal sobre o teto.
      Típico dia claro: 800–1000 W/m². Curva diária: semi-sino
