como_empezar:
  titulo: 👋 Como começar
  cuerpo: |
    O **Secasol** pré-dimensiona secadores solares passo a passo. Percorra as seções em ordem:

    1. **Tipologia** — tipo de secador e modo de análise.
    2. **Local** — coordenadas do sítio e download do clima (NASA POWER).
    3. **Coletor** — materiais, geometria e velocidade do ar.
    4. **Câmara** — geometria, produto a secar e carga.
    5. **Auxiliar** — aquecimento de apoio (opcional).
    6. **Ventilador** — ventilador ou chaminé solar para mover o ar.
    7. **Resultados** — roda o pré-dimensionamento completo e exporta o relatório.

    **Tenha à mão:** latitude/longitude do sítio e o produto a secar.

    ℹ️ É uma ferramenta de **pré-dimensionamento** (ordem de grandeza), não de certificação.
