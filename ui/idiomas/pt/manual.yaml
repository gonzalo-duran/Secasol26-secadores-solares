# Visor do manual (plano i18n, F8 — infraestrutura). Apenas o "chrome" do
# visor. Os títulos/descrições do TOC resolvem-se com
# traducir("manual.toc.<slug>.titulo", lang, default=cap.titulo): o ES canônico
# vive na tupla CAPITULOS (por isso não há chaves manual.toc.* aqui) e EN/PT
# caem ao ES até que os capítulos sejam traduzidos (F9).

