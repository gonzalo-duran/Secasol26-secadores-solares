  <title
     id="title1">Colector solar tipo 1 — vista isométrica</title>
  <desc
     id="desc1">Vista isométrica del colector solar de aire tipo 1, con canal único entre cubierta y absorbedor. Muestra largo_m, ancho_m, espaciado_m, y sentido de circulación del flujo.</desc>
