[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (imports no usados, variables no usadas)
    "I",   # isort (orden de imports)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # línea larga — la maneja black
]

[tool.pytest.ini_options]
testpaths = ["tests"]
