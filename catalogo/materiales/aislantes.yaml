  densidad: 60
  calor_especifico: 670
  T_max_servicio: 523
  fuente: "ASHRAE HoF 2021 Cap. 26"
  notas: "Mejor k que la versión liviana. Más cara y más rígida (panel)."

eps:
  descripcion: "Poliestireno expandido (telgopor)"
  descripcion_en: "Expanded polystyrene (EPS/styrofoam)"
  descripcion_pt: "Poliestireno expandido (isopor)"
  conductividad_termica: 0.038
  densidad: 20
  calor_especifico: 1300
  T_max_servicio: 348              # K (~75 °C) — ATENCIÓN
  fuente: "ASHRAE HoF 2021 Cap. 26; Incropera Tabla A.3"
  notas: |
    ¡T_max baja! No usar en contacto directo con placa absorbedora si T_placa puede
    superar 75 °C, lo cual es habitual. Útil para fondo si hay separación adecuada.

