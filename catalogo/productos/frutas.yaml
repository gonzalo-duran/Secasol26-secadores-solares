      notas: null

  notas: |
    PRODUCTO NUEVO en el catálogo. NO se pudo calibrar capa fina porque el
    único paper disponible (Goyal et al. 2007) reporta solo estadísticos de
    bondad de ajuste sin publicar los coeficientes del modelo. Mismo problema
    que durazno (Kingsly 2007). Para usar este producto en el motor, conseguir
    un paper que publique los coeficientes del modelo Page o Midilli para ciruela.

    DATOS ÚTILES extraídos del paper Goyal 2007 (no cargables en params):
      - Variedad Sutlej purple, rodajas 3.5±0.5 mm, tunnel cross-flow.
      - T ensayadas: 55, 60, 65 °C.
      - Difusividad efectiva D_eff = 3.04-4.41 × 10⁻¹⁰ m²/s (control, falling rate).
      - Pretratamientos blanqueo y blanqueo+KMS 1% reducen tiempo ~10%.
      - Sin periodo de tasa constante; todo el secado en falling rate.
      - Tiempos de secado control: 270, 270, 240 min a 55, 60, 65 °C.

    PAPERS DESCARTADOS por contenido:
      - Plum tunnel dryer 2007 (Goyal et al.) — analizado, sin coeficientes.
