# GRANADA (POMEGRANATE)
# =============================================================================
granada:
  descripcion: "Granada (Punica granatum) — arilos (semillas con pulpa). Originaria de regiones tropicales y subtropicales. La porción comestible son los arilos. El producto seco se conoce como 'anardana' en cocina india y se usa como condimento ácido. Producción argentina: emergente en Mendoza, Catamarca y NOA."
  descripcion_en: "Pomegranate (Punica granatum) — arils (seeds with pulp). Native to tropical and subtropical regions. The edible portion are the arils. The dried product is known as 'anardana' in Indian cuisine and used as a sour condiment. Argentine production: emerging in Mendoza, Catamarca and the NOA."
  descripcion_pt: "Romã (Punica granatum) — arilos (sementes com polpa). Originária de regiões tropicais e subtropicais. A porção comestível são os arilos. O produto seco é conhecido como 'anardana' na culinária indiana e usado como condimento ácido. Produção argentina: emergente em Mendoza, Catamarca e no NOA."
  categoria: FRUTA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 1050.0       # kg/m³. Estimación (no en paper).
    calor_especifico_seco: 1600.0   # J/(kg·K). Estimación Choi-Okos genérica.
    humedad_inicial_tipica: 2.72    # kg/kg ms — 271.80% bs (Kingsly & Singh 2007).
    humedad_equilibrio_aire_seco: 0.087  # final reportada en el paper.
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Humedad inicial y final: Kingsly & Singh (2007)
        DOI:10.1016/j.jfoodeng.2006.02.033 (variedad wild de Solan, Himachal Pradesh).
      Densidad y Cp: estimaciones genéricas sin paper específico. Calidad BAJA.

  forma_geometrica:
    diametro_eq_m: 0.006        # arilos enteros ~5–7 mm
    porosidad_lecho: 0.40        # arilos esféricos empacan más denso
    esfericidad: 0.9              # arilos casi esféricos
    forma: "arilos enteros (no rebanados); loading 3 kg/m² de bandeja"

  capa_fina:
    page:
      params:
        sets_por_temperatura:
          - {T_K: 323.15, k: 0.0444, n: 0.6951, R2: 0.9942}
          - {T_K: 328.15, k: 0.0476, n: 0.7045, R2: 0.9963}
          - {T_K: 333.15, k: 0.0675, n: 0.6872, R2: 0.9961}
        # Default top-level: T=55°C (mediana del rango calibrado).
        k: 0.0476
        n: 0.7045
      condiciones_calibracion:
        T_K: [323.15, 328.15, 333.15]    # 50, 55, 60 °C
        v_aire_m_s: 1.2
        espesor_m: null               # arilos enteros (no rebanados)
        HR_aire: null
        forma: "arilos enteros (no rebanados); loading 3 kg/m² de bandeja"
      calidad_datos: ALTA
      fuente: "Kingsly ARP, Singh DB (2007). Drying kinetics of pomegranate arils. J Food Eng 79(3):741-744. DOI:10.1016/j.jfoodeng.2006.02.033. Tabla 2 (Page mejor entre 4 modelos: Newton/H-Pabis/Page/Mod-Page)."
      notas: |
        DEFAULT a T=55°C. Variedad wild de Solan (Himachal Pradesh, India).
        Producto: ARILOS (semillas con pulpa), NO la fruta entera.

        CAVEAT DE UNIDADES: el paper declara en nomenclatura "t drying time (h)"
        pero los valores numéricos de k SOLO cierran físicamente si t está en
        MINUTOS. Verificación: a T=50°C, t=11 h reportado, k=0.0444, n=0.6951:
          - Con t en h:   MR(11h) = exp(-0.0444·11^0.6951) = exp(-0.232) = 0.79
            → drying barely started, NO concuerda con M_final=8.7%.
          - Con t en min: MR(660min) = exp(-0.0444·660^0.6951) = exp(-3.98) = 0.019
            → concuerda con M_final/M_0 = 0.032 (M_e pequeño).
        Mismo análisis vale para Newton, Henderson-Pabis y Modified Page.
        Los valores cargados son los del paper SIN conversión, consistentes con
        la convención del catálogo (k en min⁻ᴺ). Es un bug de nomenclatura del
        paper, no del catálogo.

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — no hay paper de isoterma de granada/arils en la carpeta."
      notas: null

  notas: |
    PRODUCTO NUEVO en el catálogo (cargado en esta sesión).
    Papers cargados:
      - Kingsly ARP, Singh DB (2007). J Food Eng 79(3):741-744.
        DOI:10.1016/j.jfoodeng.2006.02.033 [PDF en docs/notas/papers]
        → capa_fina.page (3 T: 50-60°C, calidad ALTA).
    Papers pendientes:
      - Isoterma GAB de granada/arils.


