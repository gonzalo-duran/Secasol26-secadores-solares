  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 1000.0       # kg/m³. Estimación.
    calor_especifico_seco: 1700.0   # J/(kg·K). Estimación Choi-Okos.
    humedad_inicial_tipica: 9.86    # kg/kg ms — 986.17% bs (Goyal 2007).
    humedad_equilibrio_aire_seco: 0.10
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Humedad inicial: Goyal et al. (2007) DOI:10.1016/j.jfoodeng.2006.01.041
        (var. Sutlej purple, Ludhiana, India).
      Densidad y Cp: estimaciones genéricas. Calidad BAJA.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Goyal et al. (2007) DOI:10.1016/j.jfoodeng.2006.01.041 selecciona Logarítmico como mejor (r²≈0.999) pero NO publica los coeficientes a,k,c — solo reporta r²/χ²/RMSE/MBE en Tabla 3. Mismo problema estructural que Kingsly 2007 de durazno (mismo grupo de autores indios)."
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
