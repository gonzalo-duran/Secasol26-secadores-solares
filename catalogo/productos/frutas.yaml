  descripcion_en: "Plum (Prunus domestica), sliced. Temperate-zone fruit, high initial moisture (~90% wb), rich in sugars, carotenes and phenolic compounds. The dried plum (prune) is a traditional product of Mendoza (d'Agen variety). The reference paper uses the Sutlej purple variety (India)."
  descripcion_pt: "Ameixa (Prunus domestica), em rodelas. Fruta de zona temperada, alta umidade inicial (~90% bu), rica em açúcares, carotenos e compostos fenólicos. A ameixa seca (passa) é produto tradicional de Mendoza (variedade d'Agen). O artigo de referência usa a variedade Sutlej purple (Índia)."
