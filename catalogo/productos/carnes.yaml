# =============================================================================
# carnes.yaml — CATÁLOGO DE PRODUCTOS PARA SECADO SOLAR
# Esquema: bitácora §5.9.9 + extensión §5.10.2 (Sesión 7).
# Estado: ESTRUCTURA VACÍA — coeficientes a cargar por el usuario.
# Ver PLANTILLA_REFERENCIA_CATALOGO.md para guía de carga.
# =============================================================================
#
# ADVERTENCIA ESPECIAL PARA CARNES:
# El secado de carnes tiene implicaciones de inocuidad alimentaria que NO
# existen en frutas, hortalizas u hojas. El módulo de cámara DEBE verificar
# que la actividad de agua (a_w) del producto seco sea < 0.85 para garantizar
# estabilidad microbiológica (inhibición de patógenos como Salmonella, S. aureus).
# Esta verificación se implementará en Tanda 3 paso 3 (validaciones de Camara).
#
# =============================================================================


# =============================================================================
# CHARQUI_VACUNO
# =============================================================================
charqui_vacuno:
  descripcion: "Charqui vacuno (carne bovina deshidratada y salada). Producto tradicional NOA, especialmente Puna jujeña y salteña. La sal (NaCl) modifica significativamente la isoterma de sorción respecto de carne sin sal — los parámetros de isoterma deben corresponderse con el nivel de sal usado. Humedad inicial depende del corte y pre-salado."
  descripcion_en: "Beef charqui (dehydrated, salted beef). Traditional product of Argentina's Northwest (NOA), especially the Jujuy and Salta Puna. Salt (NaCl) significantly shifts the sorption isotherm relative to unsalted meat — the isotherm parameters must match the salt level used. Initial moisture depends on the cut and pre-salting."
  descripcion_pt: "Charque bovino (carne bovina desidratada e salgada). Produto tradicional do Noroeste argentino (NOA), especialmente a Puna de Jujuy e Salta. O sal (NaCl) modifica significativamente a isoterma de sorção em relação à carne sem sal — os parâmetros da isoterma devem corresponder ao nível de sal usado. A umidade inicial depende do corte e da pré-salga."
  categoria: CARNE
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 1050.0       # kg/m³. Carne vacuna magra fresca. ASHRAE.
    calor_especifico_seco: 2170.0   # J/(kg·K). Carne magra sin agua (ASHRAE Ch.19).
    humedad_inicial_tipica: 3.0     # kg/kg ms — ~75% bh post-salado. Rango: 2.5-4.0
                                    # (varía según grosor y tiempo de salado previo).
    humedad_equilibrio_aire_seco: 0.15  # MAYOR que frutas/hortalizas por efecto de la sal
                                        # (la sal retiene agua — X_eq más alto a igual HR)
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      Densidad y Cp: ASHRAE Handbook Refrig. 2018 Ch.19 (beef lean raw).
      Humedad inicial: estimada para charqui pre-salado tradicional.
      Humedad equilibrio: efecto sal — más alto que carne sin sal.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 318-348 K (45-75°C). Trujillo et al. (2007)
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Trujillo FJ, Wiangkaew C, Pham QT (2007). J Food Eng 78(1):74-85. DOI:10.1016/j.jfoodeng.2005.09.008 [MINCyT Elsevier]"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Aykin-Dincer E, Erbas M (2018). Meat Science 145:114-120. DOI:10.1016/j.meatsci.2018.06.022 [MINCyT Elsevier] — incluye carne salada, relevante para charqui"
      notas: |
        Aykin-Dincer (2018) trabaja con beef slices a distintos contenidos
        de sal → directamente aplicable a charqui salado. Verificar que
        el nivel de sal del paper sea comparable al del charqui NOA.
        Charqui tradicional: ~10-15% de sal en peso fresco.

  difusion_interna:
    D_ref_m2_s: 9.5e-11
    T_ref_K: 303.15
    E_a_J_mol: 0.0
    geometria: lamina
    calidad_datos: BAJA
    fuente: "Reajuste S71 dentro de Secasol sobre Durán, Molina, Condorí & Buchller (2008), AVERMA 12:03.87, Fig. 22 (secador con panel FV), con la isoterma de Comaposada 2000. Ver validacion/duran2008/."
    notas: |
      D que hace que la réplica completa de Secasol (validacion/duran2008/,
      31 h con clima medido) reproduzca X(t) de la muestra del secador forzado:
      barrido 3e-11 a 1e-9, mínimo nítido en 9.5e-11 (RMSE_X 0.048, MBE 0.000;
      ±10 % en D sube el RMSE a ~0.05-0.06). Política S70: el D se ajusta
      dentro de Secasol, con su película e isoterma.
      Historia: S70 cargó 1.1e-10 con un ajuste de Fick fuera de Secasol
      (λ = 0.107 1/h, X_eq = 0.15) y el charqui corriendo con a_w = 1; con la
      isoterma de S71 ese valor secaba de más (RMSE 0.066, MBE −0.043).
      Límites: fetas de 6 mm SUPUESTAS (el paper no informa espesor; lo que
      queda determinado es D/L²). T de producto ~25-50 °C. Sin E_a (no hay
      ensayos a otra T). La muestra del secador CPC da λ = 0.060 1/h contra
      0.107: dispersión de un factor 2 entre muestras del mismo ensayo.
      Residuo conocido: la réplica sigue secando ~0.15 de X de noche contra
      ~0.09 medido, y el aire de la caja queda ~4 °C bajo (lado térmico, S70 §8).

  forma_geometrica:
    diametro_eq_m: 0.006
    forma: "fetas de ~6 mm (supuesto S70: el ensayo de Durán 2008 no informa espesor)"

  isoterma:
    gab:
      # Rama BAJA (a_w < 0.753): carne sin sal ÷ (1 + 0.20).
      params:
        X_m: 0.05527
        C: 6.162
        K: 0.9219
      # Escalón de la salmuera saturada (S71). Entre X = 0.169 y X = 0.662 la
      # superficie queda en a_w = 0.753 mientras cristaliza la sal.
      meseta:
        a_w: 0.753
        rama_alta:
          X_m: 0.3414
          C: 1.0
          K: 0.8764
      rango_T_K: [278.15, 299.15]
      calidad_datos: MEDIA
      fuente: "Comaposada J, Gou P, Arnau J (2000). The effect of sodium chloride content and temperature on pork meat isotherms. Meat Science 55(3):291-295. DOI 10.1016/S0309-1740(99)00154-0. Figs. 2 y 3, 26 °C, digitalizadas en S71."
      notas: |
        Desorción de cerdo (Gluteus medius), no vacuno; base seca TOTAL (con la
        sal). Nivel de sal elegido por el usuario (S71): 20 % NaCl b.s.
        (~5 % sobre carne fresca con 75 % de agua). El paper no tabula datos ni
        ajusta modelos; se digitalizaron las figuras a 26 °C, la T más alta
        medida (también hay 5 y 13 °C; a más T, menos X a igual a_w, así que a
        temperatura de secado la isoterma real queda algo más baja).
        La isoterma tiene un ESCALÓN en a_w = 0.753 (a_w de la solución
        saturada de NaCl): por debajo la sal cristaliza y casi no retiene agua;
        por encima la disuelve. Una sola GAB no puede representarlo (error de
        hasta 4× en X entre a_w 0.4 y 0.7), por eso dos ramas + meseta:
          - Rama baja: GAB de la carne sin sal (Fig. 3, 26 °C; RMSE 0.008)
            con X_m dividido por 1.20. El paper informa que por debajo de
            a_w 0.70 la sal no tiene efecto expresado en base libre de NaCl.
          - Rama alta: GAB con C fijado en 1 sobre los 5 puntos de 20 % NaCl
            a a_w ≥ 0.753 (Fig. 2, 26 °C; RMSE 0.055, del orden del error de
            digitalización). El ajuste libre degenera (X_m → ∞, C → 0 con
            X_m·C ≈ 0.25) porque los puntos son casi lineales en a_w: la rama
            alta es la solución salina diluyéndose, no una monocapa, y sus
            parámetros GAB son puramente empíricos.
        Puntos digitalizados (26 °C, g/g b.s.):
          sin sal: a_w .112 .226 .438 .529 .577 .708 .753 .800 .843 .903 .946
                   X   .033 .052 .091 .116 .118 .178 .182 .238 .300 .387 .503
          20 % NaCl, a_w .753 .800 .843 .903 .946 → X .57 .80 1.04 1.32 1.63
          31 % NaCl, a_w .753 .800 .843 .903 .946 → X 1.07 1.13 1.38 1.83 2.43
        La cita de esta entrada hasta S69 (J Food Eng 43(2):119-123,
        DOI 10.1016/S0260-8774(99)00142-5) no existía. Hasta S71 el charqui
        corría SIN isoterma (a_w = 1, película pura) y la réplica de Durán 2008
        secaba de noche.

  notas: |
    ADVERTENCIA DE INOCUIDAD ALIMENTARIA:
    El charqui debe alcanzar a_w < 0.85 para ser estable microbiológicamente
    (inhibición de Salmonella, E. coli, S. aureus). El módulo de cámara
    debe calcular la a_w final a partir de la isoterma y la humedad de
    equilibrio alcanzada, y alertar si a_w ≥ 0.85 al finalizar el ciclo.
    Esta validación se implementa en Tanda 3 paso 3 (§5.9.11).

    Papers prioritarios:
      - Trujillo FJ, Wiangkaew C, Pham QT (2007). Drying modeling and
        water diffusivity in beef meat. J Food Eng 78(1):74-85.
        DOI:10.1016/j.jfoodeng.2005.09.008 [MINCyT Elsevier]
      - Aykin-Dincer E, Erbas M (2018). Drying kinetics, adsorption
        isotherms and quality of vacuum-dried beef slices with different
        salt contents. Meat Science 145:114-120.
        DOI:10.1016/j.meatsci.2018.06.022 [MINCyT Elsevier]
      - Comaposada J, Gou P, Arnau J (2000). Effect of NaCl on water
        vapor pressure. J Food Eng 43(2):119-123.
        DOI:10.1016/S0260-8774(99)00142-5 [MINCyT Elsevier]

    Parámetro de proceso clave: nivel de salado previo. El charqui
    tradicional NOA usa ~150-200 g NaCl / kg carne fresca. Este nivel
    afecta tanto la cinética (sal deshidrata osmóticamente) como la
    isoterma (sal retiene agua en equilibrio).
