# =============================================================================
# TE_YERBA
# =============================================================================
te_yerba:
  descripcion: "Yerba mate (Ilex paraguariensis), hojas y tallos finos. Decisión Sesión 6: entrada única con default = yerba mate. Té negro (Camellia sinensis) queda como update futuro o carga manual. Producto importante de la región litoral y Misiones; secado solar complementario al proceso industrial (sapeco + secado)."
  descripcion_en: "Yerba mate (Ilex paraguariensis), leaves and thin stems. Session 6 decision: single entry defaulting to yerba mate. Black tea (Camellia sinensis) is left as a future update or manual entry. Important product of the Litoral region and Misiones; solar drying complements the industrial process (sapeco + drying)."
  descripcion_pt: "Erva-mate (Ilex paraguariensis), folhas e talos finos. Decisão Sessão 6: entrada única com padrão = erva-mate. Chá preto (Camellia sinensis) fica como atualização futura ou carga manual. Produto importante da região do Litoral e de Misiones; a secagem solar complementa o processo industrial (sapeco + secagem)."
  categoria: HOJA_AROMATICA
  tipo_secado: CAPA_FINA
  fotosensible: true   # clorofila y cafeína sensibles a sobreexposición térmica/UV

  propiedades_basicas:
    densidad_aparente: 380.0        # kg/m³. Hoja fresca con estructura esponjosa. Estimado.
    calor_especifico_seco: 1650.0   # J/(kg·K). Estimado. Mayoría celulosa + taninos.
    humedad_inicial_tipica: 2.3     # kg/kg ms — ~70% bh post-sapeco. Rango: 1.5-3.5
                                    # según momento de corte y etapa del proceso.
    humedad_equilibrio_aire_seco: 0.07
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Valores estimados. No se encontraron mediciones directas para yerba
      mate en handbooks estándar. Humedad inicial post-sapeco estimada
      de bibliografía de proceso industrial INTA (Schmalko 2001).

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — buscar Goneli ALD et al. (2014). J Food Process Eng. [MINCyT Wiley]"
      notas: |
        Paper de Goneli 2014 sobre Ilex paraguariensis: buscar referencia exacta
        y DOI. Si no se encuentra, alternativa: Panchariya PC et al. (2002)
        J Food Eng 52(4):349-357. DOI:10.1016/S0260-8774(01)00126-1 para
        té negro (Camellia sinensis) como analogía.

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — misma referencia que page"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — Schmalko ME, Alzamora SM (2001). Drying Technol 19(3-4):599-610. DOI:10.1081/DRT-100103937 [MINCyT Tandfonline]"
      notas: null

  notas: |
    Decisión Sesión 6: entrada única `te_yerba` con default = yerba mate.
    Té negro (Camellia sinensis) queda para update futuro.
    Papers prioritarios:
      - Goneli ALD et al. (2014). Mathematical modeling of yerba mate
        (Ilex paraguariensis) thin layer drying. J Food Process Eng.
        [buscar DOI exacto — posiblemente DOI:10.1111/jfpe.12120]
      - Panchariya PC et al. (2002). J Food Eng 52(4):349-357.
        DOI:10.1016/S0260-8774(01)00126-1 [analogía té negro, MINCyT Elsevier]
    T máxima ~60°C para preservar cafeína y polifenoles en yerba.
    Proceso industrial: sapeco (~300°C, 30 seg) → zarandeo → secado.
    El secado solar aplica a la etapa post-sapeco.


# =============================================================================
# OREGANO
# =============================================================================
oregano:
  descripcion: "Orégano (Origanum vulgare), hojas y tallos finos. Producción relevante en NOA (Salta, Jujuy, La Rioja). Principal producto de exportación de hierbas secas de Argentina. Calidad determinada por contenido de aceites esenciales (timol, carvacrol) — sensible a temperatura alta."
  descripcion_en: "Oregano (Origanum vulgare), leaves and thin stems. Significant production in the NOA (Salta, Jujuy, La Rioja). Argentina's main dried-herb export. Quality determined by essential-oil content (thymol, carvacrol) — sensitive to high temperature."
  descripcion_pt: "Orégano (Origanum vulgare), folhas e talos finos. Produção relevante no NOA (Salta, Jujuy, La Rioja). Principal produto de exportação de ervas secas da Argentina. Qualidade determinada pelo teor de óleos essenciais (timol, carvacrol) — sensível a temperatura alta."
  categoria: HOJA_AROMATICA
  tipo_secado: CAPA_FINA
  fotosensible: true   # aceites esenciales (timol, carvacrol) sensibles a UV y calor > 50°C

  propiedades_basicas:
    densidad_aparente: 350.0        # kg/m³. Hoja fresca con estructura labiada. Estimado.
    calor_especifico_seco: 1600.0   # J/(kg·K). Estimado.
    humedad_inicial_tipica: 5.7     # kg/kg ms — ~85% bh. Rango: 4-7 según estado de cosecha.
    humedad_equilibrio_aire_seco: 0.09
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Valores estimados. USDA SR-28 (oregano fresh) da ~90% bh.
      Densidad aparente estimada por analogía con hojas de tomillo/menta.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 323-343 K. Akpinar (2006) o Soysal et al. (2009)
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Akpinar EK (2006). J Food Eng 77(4):864-870. DOI:10.1016/j.jfoodeng.2005.08.014 (incluye orégano entre varias aromáticas)"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Soysal Y, Arslan M, Keskin M (2009). Food Sci Technol Int 15(4):397-406. DOI:10.1177/1082013209346588 [MINCyT SAGE]"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — buscar isoterma de orégano. Alternativa: Lemus-Mondaca et al. o Akpinar (2006)."
      notas: null

  notas: |
    Papers prioritarios:
      - Akpinar EK (2006). Mathematical modelling of thin layer drying
        process under open sun of some aromatic plants.
        J Food Eng 77(4):864-870. DOI:10.1016/j.jfoodeng.2005.08.014 [MINCyT Elsevier]
      - Soysal Y, Arslan M, Keskin M (2009). Intermittent microwave-convective
        air drying of oregano. Food Sci Technol Int 15(4):397-406.
        DOI:10.1177/1082013209346588 [MINCyT SAGE — verificar acceso]
    T máxima recomendada 45-50°C para calidad comercial (aceites esenciales).
    Secado solar con aire a 40-55°C es el rango ideal para orégano.
    fotosensible: true — preferir cámara con cubierta traslúcida, no transparente UV.


# =============================================================================
# COCA
# =============================================================================
coca:
  descripcion: "Hoja de coca (Erythroxylum coca). Producción en NOA (Jujuy, Salta). Literatura científica de cinética de secado escasa por restricciones legales internacionales. Parámetros ESTIMADOS POR ANALOGÍA con yerba mate (hojas de arbusto similar tamaño, estructura laminar comparable, rango de humedad similar). Usar con precaución extrema."
  descripcion_en: "Coca leaf (Erythroxylum coca). Production in the NOA (Jujuy, Salta). Scientific drying-kinetics literature is scarce due to international legal restrictions. Parameters ESTIMATED BY ANALOGY with yerba mate (shrub leaves of similar size, comparable laminar structure, similar moisture range). Use with extreme caution."
  descripcion_pt: "Folha de coca (Erythroxylum coca). Produção no NOA (Jujuy, Salta). Literatura científica de cinética de secagem escassa por restrições legais internacionais. Parâmetros ESTIMADOS POR ANALOGIA com a erva-mate (folhas de arbusto de tamanho similar, estrutura laminar comparável, faixa de umidade similar). Usar com precaução extrema."
  categoria: HOJA_AROMATICA
  tipo_secado: CAPA_FINA
  fotosensible: true   # cocaína y alcaloides degradan con UV; clorofila también

  propiedades_basicas:
    densidad_aparente: 400.0        # kg/m³. Estimado por analogía con yerba mate.
    calor_especifico_seco: 1650.0   # J/(kg·K). Estimado.
    humedad_inicial_tipica: 1.3     # kg/kg ms — ~57% bh. Fuente: UNODC (2006/2019).
    humedad_equilibrio_aire_seco: 0.08
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Humedad inicial: UNODC World Drug Report (2006/2019) — hoja fresca
      ~57% bh (base húmeda). Densidad y Cp estimados por analogía.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: ESTIMADA_POR_ANALOGIA
      fuente: "PENDIENTE — copiar de te_yerba.capa_fina.page una vez que esté disponible"
      notas: |
        ESTIMADA_POR_ANALOGIA con yerba mate. Decisión Sesión 6.
        Si se encuentran papers específicos de cinética de hoja de coca
        (repositorios UMSA Bolivia, UNALM Perú, ASADES, AVERMA), reemplazar.
        Buscar términos: "secado hoja coca", "coca leaf drying kinetics",
        "Erythroxylum drying".

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: ESTIMADA_POR_ANALOGIA
      fuente: "PENDIENTE — copiar de te_yerba.capa_fina.midilli"
      notas: |
        ESTIMADA_POR_ANALOGIA. Ver notas de page.

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: ESTIMADA_POR_ANALOGIA
      fuente: "PENDIENTE — analogía con yerba mate"
      notas: null

  notas: |
    PRODUCTO CON DATOS DE ANALOGÍA. Incertidumbre alta.
    La literatura científica de cinética de secado de hoja de coca
    es muy escasa a nivel internacional (publicaciones en inglés se
    centran en extracción de alcaloides, no en deshidratación).
    Fuentes a explorar: repositorios latinoamericanos en español
    (UMSA Bolivia, UNALM Perú, ASADES Argentina).
    Todos los parámetros se estiman por analogía con yerba mate
    hasta que se encuentren datos calibrados.
    T de secado habitual en práctica andina: 35-45°C al sol.
