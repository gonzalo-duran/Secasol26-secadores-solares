# CEBOLLA
# =============================================================================
cebolla:
  descripcion: "Cebolla (Allium cepa) en aros o rodajas. Producción importante en Cuyo y zonas áridas NOA. Alta humedad inicial (~89% bh). El compuesto de azufre afecta el sabor del producto seco — secado rápido a T moderada preserva calidad."
  descripcion_en: "Onion (Allium cepa), in rings or slices. Significant production in Cuyo and the arid NOA. High initial moisture (~89% wb). The sulfur compound affects the flavor of the dried product — fast drying at moderate temperature preserves quality."
  descripcion_pt: "Cebola (Allium cepa), em anéis ou rodelas. Produção importante em Cuyo e nas zonas áridas do NOA. Alta umidade inicial (~89% bu). O composto de enxofre afeta o sabor do produto seco — secagem rápida a temperatura moderada preserva a qualidade."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 900.0        # kg/m³. ASHRAE Ch.19.
    calor_especifico_seco: 1370.0   # J/(kg·K). Choi-Okos.
    humedad_inicial_tipica: 8.1     # kg/kg ms — ~89% bh. Rango: 7-9.
    humedad_equilibrio_aire_seco: 0.07
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      Densidad: ASHRAE Ch.19. Cp, X0: USDA SR-28 + Choi-Okos.

  capa_fina:
    page:
