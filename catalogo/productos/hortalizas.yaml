      fuente: "PENDIENTE — Akpinar et al. (2003) DOI:10.1016/S0196-8904(02)00171-1 y/o Naderinezhad et al. (2016) DOI:10.1002/fsn3.258 [OA Wiley]"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — Kaymak-Ertekin & Gedik (2004). LWT 37(4):429-438. DOI:10.1016/j.lwt.2003.10.012 (incluye papa)"
