    Pretratamiento habitual: blanching o inmersión en salmuera.


# =============================================================================
# PIMIENTO_ROJO
# =============================================================================
pimiento_rojo:
  descripcion: "Pimiento rojo (Capsicum annuum) en rodajas o tiras, para producción de pimentón. Cultivo relevante en NOA (Salta, La Rioja). Contiene capsaicina y carotenoides (responsables del color del pimentón). Sensible a pérdida de color a T > 70°C."
  descripcion_en: "Red bell pepper (Capsicum annuum), in slices or strips, for paprika production. Significant crop in the NOA (Salta, La Rioja). Contains capsaicin and carotenoids (responsible for paprika's color). Sensitive to color loss at T > 70°C."
  descripcion_pt: "Pimentão vermelho (Capsicum annuum), em rodelas ou tiras, para produção de páprica. Cultivo relevante no NOA (Salta, La Rioja). Contém capsaicina e carotenoides (responsáveis pela cor da páprica). Sensível à perda de cor a T > 70°C."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: true   # carotenoides (color del pimentón) se degradan con luz UV y calor excesivo

  propiedades_basicas:
    densidad_aparente: 890.0        # kg/m³. ASHRAE Ch.19.
    calor_especifico_seco: 1450.0   # J/(kg·K). Estimado.
    humedad_inicial_tipica: 10.7    # kg/kg ms — ~91.5% bh. Rango: 9-12.
    humedad_equilibrio_aire_seco: 0.08
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      USDA SR-28 (red bell pepper, raw). Cp estimado por Choi-Okos.

  forma_geometrica:
    diametro_eq_m: 0.008        # rodajas/tiras 6–10 mm
    porosidad_lecho: 0.45
    esfericidad: 0.6
    forma: "rodajas/tiras de pimiento bell"

  capa_fina:
    page:
      params:
        sets_por_temperatura:
          - {T_K: 323.15, k: 0.00726, n: 1.29310, R2: 0.9874}
          - {T_K: 333.15, k: 0.01123, n: 1.34950, R2: 0.9835}
          - {T_K: 343.15, k: 0.01365, n: 1.38587, R2: 0.9867}
          - {T_K: 353.15, k: 0.01741, n: 1.40500, R2: 0.9918}
        # Default top-level: T=60°C (más representativa de secado solar en NOA).
        k: 0.01123
        n: 1.34950
      condiciones_calibracion:
        T_K: [323.15, 333.15, 343.15, 353.15]   # 50, 60, 70, 80 °C
        v_aire_m_s: 2.5
        espesor_m: 0.010      # cubos de 1 cm (no rodajas)
        HR_aire: null
      calidad_datos: ALTA
      fuente: "Vega A, Fito P, Andrés A, Lemus R (2007). Mathematical modeling of hot-air drying kinetics of red bell pepper (var. Lamuyo). J Food Eng 79(4):1460-1466. DOI:10.1016/j.jfoodeng.2006.04.028. Tablas 5 y 6."
      notas: |
        DEFAULT RECOMENDADO a T=60°C. Calibración con cubos de 1 cm
        (var. Lamuyo, España), v_aire=2.5 m/s, solo periodo de tasa
        decreciente. El paper también reporta Page Modificado
        (mejor ajuste estadístico que Page) y Henderson-Pabis, pero
        el catálogo no expone esos modelos todavía. Ea(Page)=18.22 kJ/mol;
        Ea(D_eff)=39.70 kJ/mol, D0=9.19e-3 m²/s (para futuro cableado
        Arrhenius). El paper observa que la calidad del color (capsantina)
        se degrada severamente a T > 70°C — preferir T ≤ 65°C.

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Vega (2007) no calibra Midilli (usa Page Modificado y H-Pabis). Buscar paper específico con Midilli para pimiento."
      notas: null

  isoterma:
    gab:
      params:
        X_m: 0.08     # g agua / g ms (monolayer)
        C: 12.53      # constante de Guggenheim
        K: 1.02       # constante multilayer
      rango_T_K: [303.15, 303.15]   # única T de medición
      calidad_datos: MEDIA
      fuente: "Vega A, Fito P, Andrés A, Lemus R (2007). J Food Eng 79(4):1460-1466. DOI:10.1016/j.jfoodeng.2006.04.028. Tabla 2 (isoterma de desorción a 30°C, sales saturadas, método gravimétrico estático)."
      notas: |
        Isoterma medida a UNA SOLA TEMPERATURA (30°C), bastante por
        debajo de la T de operación de secado solar (50-80°C). El motor
        termodinámico extrapolará fuera del rango de calibración.
        Ajuste GAB: r²=0.91, %E=11.22 — calidad MEDIA (vs r²>0.99 de
        productos con datos multi-T).
        Para uso serio: completar con Kaymak-Ertekin & Sultanoğlu (2001),
        J Food Eng 47:225-231, que reporta isotermas de pimiento a varias T.
        Como check: X_we experimental a 50/60/70/80 °C = 0.064/0.040/0.032/0.021
        kg/kg ms (Vega 2007 Tabla 3).

  notas: |
    Papers cargados:
      - Vega A, Fito P, Andrés A, Lemus R (2007). J Food Eng 79(4):1460-1466.
        DOI:10.1016/j.jfoodeng.2006.04.028 [MINCyT Elsevier]
        → cargado en capa_fina.page (4 T: 50-80°C) e isoterma.gab (30°C, MEDIA).
    Papers pendientes:
      - Akpinar EK, Bicer Y, Yildiz C (2003). Thin layer drying of red pepper.
        J Food Eng 59(1):99-104. DOI:10.1016/S0260-8774(02)00425-9 [PDF en docs/notas/papers].
        Modelo seleccionado: "Aproximación de la difusión" (no Page ni Midilli).
      - Kaymak-Ertekin & Sultanoğlu (2001). J Food Eng 47:225-231 —
        para isoterma GAB multi-T (no descargado).
    T máxima recomendada ~65°C para preservar capsantina (color rojo).
    fotosensible: true — cámara preferentemente protegida de luz directa.


# =============================================================================
# ZANAHORIA_RALLADA
# =============================================================================
zanahoria_rallada:
  descripcion: "Zanahoria (Daucus carota) rallada. La geometría de rallado difiere fundamentalmente de los ensayos estándar de rodajas — el espesor efectivo es mucho menor (~0.5-1.5 mm) y la relación superficie/volumen es mucho mayor. Los parámetros de capa fina de papers de rodajas son solo orientativos."
  descripcion_en: "Grated carrot (Daucus carota). The grated geometry fundamentally differs from standard slice tests — the effective thickness is much smaller (~0.5-1.5 mm) and the surface/volume ratio much higher. The thin-layer parameters from slice papers are only indicative."
  descripcion_pt: "Cenoura (Daucus carota) ralada. A geometria de ralado difere fundamentalmente dos ensaios padrão de rodelas — a espessura efetiva é muito menor (~0.5-1.5 mm) e a relação superfície/volume é muito maior. Os parâmetros de camada fina de artigos de rodelas são apenas orientativos."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 880.0        # kg/m³. Zanahoria fresca.
    calor_especifico_seco: 1470.0   # J/(kg·K). Choi-Okos.
    humedad_inicial_tipica: 9.0     # kg/kg ms — ~90% bh. Rango: 8-10.
    humedad_equilibrio_aire_seco: 0.08
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      ASHRAE Ch.19 + USDA SR-28 (carrot raw). Cp por Choi-Okos.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 323-343 K (50-70°C). Doymaz (2004)
        v_aire_m_s: null
        espesor_m: null   # ATENCIÓN: papers usan rodajas (3-10mm), no rallado
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Doymaz I (2004). J Food Eng 61(3):359-364. DOI:10.1016/S0260-8774(03)00142-0"
      notas: |
        ADVERTENCIA GEOMÉTRICA: los coeficientes de Doymaz (2004) son para
