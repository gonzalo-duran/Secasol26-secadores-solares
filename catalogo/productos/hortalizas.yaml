# MANDIOCA
# =============================================================================
mandioca:
  descripcion: "Mandioca (Manihot esculenta), raíz en rodajas o rallada. Producción relevante en NOA (ramal jujeño, sudeste de Salta). Alta densidad de almidón. Encogimiento moderado durante secado. Humedad inicial ~60-65% bh."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 1100.0       # kg/m³. Raíz densa por contenido de almidón.
    calor_especifico_seco: 1480.0   # J/(kg·K). Choi-Okos (mayoría carbohidrato).
    humedad_inicial_tipica: 1.9     # kg/kg ms — ~65% bh. Rango: 1.5-2.5.
    humedad_equilibrio_aire_seco: 0.10
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      USDA SR-28 (cassava raw, ~60% bh). Densidad estimada por composición.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Dairo OU et al. (2015). Acta Technol Agric 18(4):102-107. DOI:10.1515/ata-2015-0021 [OA De Gruyter]"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Dairo et al. (2015) o alternativa de secado solar."
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — Sanni LO et al. (1997). J Food Eng 34(2):203-212. DOI:10.1016/S0260-8774(97)00072-6 [MINCyT Elsevier] (fufu/tapioca)"
      notas: |
        Sanni et al. (1997) trabaja con mandioca procesada (fufu, tapioca).
        Para raíz fresca en rodajas la isoterma puede diferir. Verificar.

  notas: |
    Papers prioritarios:
      - Dairo OU et al. (2015). Solar drying kinetics of cassava slices.
        Acta Technol Agric 18(4):102-107. DOI:10.1515/ata-2015-0021 [OA De Gruyter]
    La mandioca tiene toxicidad por cianuro (HCN) en variedades amargas.
    El secado elimina el HCN por volatilización. Esto no afecta los
    parámetros cinéticos pero sí es relevante para el diseño de la
    cámara (ventilación mínima obligatoria para variedades amargas).
