# =============================================================================
# TOMATE
# =============================================================================
tomate:
  descripcion: "Tomate (Solanum lycopersicum) en rodajas o mitades. Producción relevante en NOA y Cuyo. Para uso como tomate deshidratado o polvo. Alta humedad inicial (~94% bh). Sensible a pardeado no enzimático (reacción de Maillard) a altas temperaturas."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 950.0        # kg/m³ — tomate fresco en rodajas. ASHRAE Ch.19.
    calor_especifico_seco: 1340.0   # J/(kg·K) — estimado Choi-Okos. Calidad MEDIA.
    humedad_inicial_tipica: 15.7    # kg/kg ms — equivale a 94% bh. Rango: 13-17.
    humedad_equilibrio_aire_seco: 0.08
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      Densidad y cp: ASHRAE Handbook Refrig. 2018 Ch.19 + Choi-Okos.
      Humedad inicial: USDA SR-28 (tomate crudo ~94% bh).

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: ~328-343 K (55-70°C). Paper ref: Doymaz (2007)
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Doymaz I (2007). J Food Eng 78(4):1291-1297. DOI:10.1016/j.jfoodeng.2005.12.047"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Doymaz I (2007). DOI:10.1016/j.jfoodeng.2005.12.047 y/o Sacilik et al. (2006) secado solar túnel. DOI:10.1016/j.jfoodeng.2005.01.025"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — Akanbi et al. (2006). J Food Eng 73(2):157-163. DOI:10.1016/j.jfoodeng.2005.01.011"
      notas: null

  notas: |
    Papers prioritarios de la shopping list:
      - Doymaz I (2007). Air-drying characteristics of tomatoes.
        J Food Eng 78(4):1291-1297. DOI:10.1016/j.jfoodeng.2005.12.047 [MINCyT Elsevier]
      - Sacilik K, Keskin R, Elicin AK (2006). Mathematical modelling of solar
        tunnel drying of thin layer organic tomato.
        J Food Eng 73(3):231-238. DOI:10.1016/j.jfoodeng.2005.01.025 [MINCyT Elsevier]
    Temperatura máxima recomendada ~65°C para preservar licopeno.
    Pretratamientos comunes: blanching, sulfitado leve.


