# =============================================================================
# TOMATE
# =============================================================================
tomate:
  descripcion: "Tomate (Solanum lycopersicum) en rodajas o mitades. Producción relevante en NOA y Cuyo. Para uso como tomate deshidratado o polvo. Alta humedad inicial (~94% bh). Sensible a pardeado no enzimático (reacción de Maillard) a altas temperaturas."
  descripcion_en: "Tomato (Solanum lycopersicum), sliced or halved. Significant production in the NOA and Cuyo. For use as dried tomato or powder. High initial moisture (~94% wb). Sensitive to non-enzymatic browning (Maillard reaction) at high temperatures."
  descripcion_pt: "Tomate (Solanum lycopersicum), em rodelas ou metades. Produção relevante no NOA e em Cuyo. Para uso como tomate desidratado ou em pó. Alta umidade inicial (~94% bu). Sensível ao escurecimento não enzimático (reação de Maillard) a altas temperaturas."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 950.0        # kg/m³ — tomate fresco en rodajas. ASHRAE Ch.19.
    calor_especifico_seco: 1340.0   # J/(kg·K) — estimado Choi-Okos. Calidad MEDIA.
    humedad_inicial_tipica: 15.7    # kg/kg ms — equivale a 94% bh. Rango: 13-17.
    humedad_equilibrio_aire_seco: 0.08
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      Densidad y cp: ASHRAE Handbook Refrig. 2018 Ch.19 + Choi-Okos.
      Humedad inicial: USDA SR-28 (tomate crudo ~94% bh).

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: ~328-343 K (55-70°C). Paper ref: Doymaz (2007)
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Doymaz I (2007). J Food Eng 78(4):1291-1297. DOI:10.1016/j.jfoodeng.2005.12.047"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Doymaz I (2007). DOI:10.1016/j.jfoodeng.2005.12.047 y/o Sacilik et al. (2006) secado solar túnel. DOI:10.1016/j.jfoodeng.2005.01.025"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — Akanbi et al. (2006). J Food Eng 73(2):157-163. DOI:10.1016/j.jfoodeng.2005.01.011"
      notas: null

  notas: |
    Papers prioritarios de la shopping list:
      - Doymaz I (2007). Air-drying characteristics of tomatoes.
        J Food Eng 78(4):1291-1297. DOI:10.1016/j.jfoodeng.2005.12.047 [MINCyT Elsevier]
      - Sacilik K, Keskin R, Elicin AK (2006). Mathematical modelling of solar
        tunnel drying of thin layer organic tomato.
        J Food Eng 73(3):231-238. DOI:10.1016/j.jfoodeng.2005.01.025 [MINCyT Elsevier]
    Temperatura máxima recomendada ~65°C para preservar licopeno.
    Pretratamientos comunes: blanching, sulfitado leve.


# =============================================================================
# PAPA
# =============================================================================
papa:
  descripcion: "Papa (Solanum tuberosum) en rodajas o cubos. Producto de alta disponibilidad en NOA (Puna). Relativamente alta densidad y baja humedad inicial comparado a otras hortalizas (~80% bh). Encogimiento significativo durante secado."
  descripcion_en: "Potato (Solanum tuberosum), sliced or diced. Widely available in the NOA (Puna). Relatively high density and low initial moisture compared with other vegetables (~80% wb). Significant shrinkage during drying."
  descripcion_pt: "Batata (Solanum tuberosum), em rodelas ou cubos. Produto de alta disponibilidade no NOA (Puna). Densidade relativamente alta e baixa umidade inicial em comparação com outras hortaliças (~80% bu). Encolhimento significativo durante a secagem."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 1050.0       # kg/m³. ASHRAE Ch.19.
    calor_especifico_seco: 1550.0   # J/(kg·K). Choi-Okos con composición papa cruda.
    humedad_inicial_tipica: 4.5     # kg/kg ms — ~82% bh. Naderinezhad (2016) reporta 4.491.
    humedad_equilibrio_aire_seco: 0.09
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      Densidad: ASHRAE Handbook Refrig. 2018 Ch.19.
      Cp: USDA SR-28 + Choi-Okos.
      X0 actualizada a 4.5 desde Naderinezhad et al. (2016) Food Sci Nutr 4(1):110-118,
      DOI:10.1002/fsn3.258 (rodajas circulares 7 mm, media 449.1% bs).
      USDA SR-28 reporta ~4.0; rango razonable 4.0-5.0.

  forma_geometrica:
    diametro_eq_m: 0.010        # cubos ~10 mm o rodajas espesas 7-12 mm
    porosidad_lecho: 0.45
    esfericidad: 0.7              # cubos/dados (más esféricos que rodajas)
    forma: "cubos 10 mm o rodajas espesas"

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 333-353 K (60-80°C). Paper ref: Akpinar et al. (2003)
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Akpinar EK, Midilli A, Bicer Y (2003). Energy Convers Manag 44(10):1689-1705. DOI:10.1016/S0196-8904(02)00171-1"
      notas: null

    midilli:
      params:
        sets_por_temperatura:
          - {T_K: 318.15, a: 1.00900, k: 0.01404, n: 0.87280, b: -0.00019, R2: 0.99986}
          - {T_K: 328.15, a: 1.00700, k: 0.01722, n: 0.85460, b: -0.00031, R2: 0.99990}
          - {T_K: 333.15, a: 1.00800, k: 0.01873, n: 0.82340, b: -0.00019, R2: 0.99991}
          - {T_K: 343.15, a: 1.00800, k: 0.02004, n: 0.84520, b: -0.00019, R2: 0.99986}
        # Default top-level: T=60°C (Test 3 del paper — R² más alto, T representativa).
        a: 1.00800
        k: 0.01873
        n: 0.82340
        b: -0.00019
      condiciones_calibracion:
        T_K: [318.15, 328.15, 333.15, 343.15]    # 45, 55, 60, 70 °C
        v_aire_m_s: 1.81
        espesor_m: 0.007        # rodajas circulares de 7 mm
        HR_aire: null
        pretratamiento: "blanqueo 5 min agua hirviendo 90°C + 2 min agua fría 10°C"
      calidad_datos: ALTA
      fuente: "Naderinezhad S, Etesami N, Poormalek Najafabady A, Ghasemi Falavarjani M (2016). Mathematical modeling of drying of potato slices in a forced convective dryer based on important parameters. Food Sci Nutr 4(1):110-118. DOI:10.1002/fsn3.258. Tabla 3 (tests 1-4: circle, v=1.81 m/s). [OA Wiley]"
      notas: |
        DEFAULT a T=60°C. Calibración con rodajas circulares de 7 mm,
        v_aire=1.81 m/s, pretratamiento de blanqueo. R²>0.999 en todos los
        sets. Modelo seleccionado tras comparar 21 modelos en el paper.
        El paper también provee una regresión multiparamétrica de
        (a, b, k, n) vs (T, V) — ver Tablas 4-5 del paper — útil para
        interpolar fuera de los 4 sets cargados pero no representable en
        el esquema actual del catálogo.
        Caveat: b₁ (T=45°C) aparece como "0.00019-" en el PDF; interpretado
        como -0.00019 por consistencia con los demás sets (todos b<0).

  isoterma:
    gab:
      params:
        # Default a T=45°C (mediana del rango calibrado 30-60°C).
        X_m: 0.073     # monocapa (no depende de T en GAB de Van den Berg)
        C: 10.163      # = C0 · exp(ΔH_c / RT) a T=318.15 K
        K: 0.869       # = K0 · exp(ΔH_k / RT) a T=318.15 K
        sets_por_temperatura:
          - {T_K: 303.15, X_m: 0.073, C: 26.678, K: 0.927}
          - {T_K: 318.15, X_m: 0.073, C: 10.163, K: 0.869}
          - {T_K: 333.15, X_m: 0.073, C: 4.223,  K: 0.820}
        # Parámetros entrópicos del modelo de Van den Berg (no usados por el
        # motor actual; quedan para futura extensión que cablee C(T) y K(T)):
        entalpicos:
          M_0: 0.073
          C_0: 3.44e-8
          K_0: 0.235
          dH_c_kJ_mol: 51.590
          dH_k_kJ_mol: 3.460
      rango_T_K: [303.15, 333.15]   # 30-60 °C
      calidad_datos: ALTA
      fuente: "Kaymak-Ertekin F, Gedik A (2004). Sorption isotherms and isosteric heat of sorption for grapes, apricots, apples and potatoes. LWT - Food Sci Technol 37(4):429-438. DOI:10.1016/j.lwt.2003.10.012. Tabla 6 (curva DESORCIÓN — apropiada para secado). Variedades turcas Bozdağ/Ödemiş, alto almidón, método gravimétrico estático con 10 sales saturadas, n=3 réplicas."
      notas: |
        Curva de DESORCIÓN (relevante para secado).
        El paper reporta C y K como funciones de T vía Van den Berg:
            C(T) = C_0 · exp(ΔH_c / R·T)
            K(T) = K_0 · exp(ΔH_k / R·T)
        El motor actual usa C y K fijos → cargados a T=45°C (mediana del rango).
        Para extrapolación a T_op ≫ 45°C recomputar desde `entalpicos`.
        Validación contra Tabla 5 (puntos selectos):
            T=30°C, aw=0.560: M_exp=0.144, M_gab=0.147 (+2%)
            T=45°C, aw=0.469: M_exp=0.106, M_gab=0.108 (+2%)
            T=60°C, aw=0.497: M_exp=0.099, M_gab=0.092 (-8%)
        Calidad ALTA: P(%)=7.91. GAB es buen ajuste para papa (alto almidón).

  notas: |
    Papers cargados:
      - Naderinezhad S et al. (2016). Food Sci Nutr 4(1):110-118.
        DOI:10.1002/fsn3.258 [OA Wiley]
        → cargado en capa_fina.midilli (4 T: 45-70°C) y propiedades_basicas (X0).
      - Kaymak-Ertekin F, Gedik A (2004). LWT 37(4):429-438.
        DOI:10.1016/j.lwt.2003.10.012 [PDF en docs/notas/papers]
        → cargado en isoterma.gab (curva desorción, 3 T: 30-60°C, calidad ALTA).
    Papers pendientes:
      - Akpinar EK, Midilli A, Bicer Y (2003). Single layer drying behaviour of
        potato slices in a convective cyclone dryer.
        Energy Convers Manag 44(10):1689-1705. DOI:10.1016/S0196-8904(02)00171-1
        [PDF en docs/notas/papers]. Modelo seleccionado: "Aproximación de la
        difusión"; también ajusta Page → útil para llenar capa_fina.page.
      - Hassini et al. (2007). Difusividad efectiva con corrección de encogimiento
        [PDF en docs/notas/papers]. Útil para Arrhenius futuro; no carga directo
        en capa_fina.
    Encogimiento importante (Hassini 2007 lo cuantifica como "ideal", 77% reducción
    de volumen) → el modelo de espesor constante subestima el tiempo final de secado.


