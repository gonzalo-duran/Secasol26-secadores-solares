        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Sharma GP, Verma RC, Pathare PB (2005). J Food Eng 71(3):282-286. DOI:10.1016/j.jfoodeng.2005.02.010"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Sharma et al. (2005) DOI:10.1016/j.jfoodeng.2005.02.010"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — buscar isoterma específica de cebolla. Alternativa: Kaymak-Ertekin & Sultanoğlu (2001) J Food Eng 47:225-231."
      notas: null

  notas: |
    Papers prioritarios:
      - Sharma GP, Verma RC, Pathare PB (2005). Mathematical modeling of
        infrared radiation thin layer drying of onion slices.
        J Food Eng 71(3):282-286. DOI:10.1016/j.jfoodeng.2005.02.010 [MINCyT Elsevier]
