# =============================================================================
# ZANAHORIA_RALLADA
# =============================================================================
zanahoria_rallada:
  descripcion: "Zanahoria (Daucus carota) rallada. La geometría de rallado difiere fundamentalmente de los ensayos estándar de rodajas — el espesor efectivo es mucho menor (~0.5-1.5 mm) y la relación superficie/volumen es mucho mayor. Los parámetros de capa fina de papers de rodajas son solo orientativos."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 880.0        # kg/m³. Zanahoria fresca.
    calor_especifico_seco: 1470.0   # J/(kg·K). Choi-Okos.
    humedad_inicial_tipica: 9.0     # kg/kg ms — ~90% bh. Rango: 8-10.
    humedad_equilibrio_aire_seco: 0.08
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      ASHRAE Ch.19 + USDA SR-28 (carrot raw). Cp por Choi-Okos.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 323-343 K (50-70°C). Doymaz (2004)
        v_aire_m_s: null
        espesor_m: null   # ATENCIÓN: papers usan rodajas (3-10mm), no rallado
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Doymaz I (2004). J Food Eng 61(3):359-364. DOI:10.1016/S0260-8774(03)00142-0"
      notas: |
        ADVERTENCIA GEOMÉTRICA: los coeficientes de Doymaz (2004) son para
        rodajas de zanahoria (espesor ~3-10 mm). Para zanahoria rallada el
        espesor efectivo es ~0.5-1.5 mm → el secado es más rápido.
        Calidad rebajada a MEDIA por mismatch geométrico, independientemente
        de la calidad del paper original.

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Aghbashlo M et al. (2009). Int Agrophys 23:313-317. [OA]"
      notas: |
        Misma advertencia geométrica que para `page`. Ver notas del producto.

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — buscar isoterma específica de zanahoria."
      notas: null

  notas: |
    ADVERTENCIA CENTRAL: la literatura de cinética de zanahoria trabaja con
    rodajas. La zanahoria rallada tiene espesor efectivo ~5-10x menor. Al
    usar estos parámetros en el módulo de cámara, los tiempos de secado
    calculados serán MAYORES que los reales. Margen conservador para prediseño.
    Si se desea mayor precisión, calibrar con datos propios de rallado.
    Papers prioritarios:
      - Doymaz I (2004). J Food Eng 61(3):359-364.
        DOI:10.1016/S0260-8774(03)00142-0 [MINCyT Elsevier]


# =============================================================================
# PEREJIL
# =============================================================================
perejil:
  descripcion: "Perejil (Petroselinum crispum), hojas frescas. Alta relación superficie/volumen por su estructura laminar. Producto aromático — temperatura máxima ~50°C para preservar aceites esenciales. Secado relativamente rápido."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: true   # aceites esenciales (apiol, mirceno) sensibles a UV

  propiedades_basicas:
    densidad_aparente: 450.0        # kg/m³. Estimado para hoja fresca con estructura aérea.
    calor_especifico_seco: 1600.0   # J/(kg·K). Estimado.
    humedad_inicial_tipica: 5.7     # kg/kg ms — ~85% bh. Rango: 5-7.
    humedad_equilibrio_aire_seco: 0.10
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Valores estimados. No se encontraron mediciones directas en
      handbooks para perejil fresco. Actualizar cuando se disponga.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 308-333 K (35-60°C). Papers de hojas aromáticas.
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Soysal Y (2004). Biosyst Eng 89(2):167-173. DOI:10.1016/j.biosystemseng.2004.07.008 [MINCyT Elsevier] (microondas — calidad MEDIA para solar)"
      notas: |
        Advertencia: paper de microondas, no convección. Usar como orientación.
        Para convección solar, buscar alternativa o usar por analogía con
        hojas de menta (Doymaz 2006, J Food Eng 74(3):370-375).

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Soysal et al. (2006). Biosystems Eng 93:403-413. DOI:10.1016/j.biosystemseng.2006.01.017"
      notas: null

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE"
      notas: null

  notas: |
    La literatura de perejil es predominantemente de microondas o IR.
    Para secado solar convectivo, los coeficientes de microondas son
    orientativos (calidad MEDIA como máximo).
    Alternativa: usar valores de hojas de menta como analogía
    (morfología similar, categoría similar de hojas con aceites esenciales).


# =============================================================================
# APIO
# =============================================================================
apio:
  descripcion: "Apio (Apium graveolens), pecíolos y hojas. Literatura escasa para secado convectivo solar. Parámetros ESTIMADOS POR ANALOGÍA con perejil (morfología similar: tallo herbáceo + hoja plana, composición parecida). Usar con precaución."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: true

  propiedades_basicas:
    densidad_aparente: 600.0        # kg/m³. Estimado (tallo hueco + hoja). MEDIA.
    calor_especifico_seco: 1550.0   # J/(kg·K). Estimado Choi-Okos.
    humedad_inicial_tipica: 22.2    # kg/kg ms — ~95.7% bh. Rango: 18-25.
    humedad_equilibrio_aire_seco: 0.09
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      USDA SR-28 (celery raw, ~95.4% bh). Densidad y Cp estimados.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: ESTIMADA_POR_ANALOGIA
      fuente: "PENDIENTE — usar valores de perejil (Soysal 2004/2006) como punto de partida"
      notas: |
        ESTIMADA_POR_ANALOGIA con perejil. Decisión tomada en Sesión 6:
        literatura específica de apio para secado solar es escasa. Si se
        dispone de datos calibrados de apio en el futuro, reemplazar.
        La analogía es razonable: morfología similar (hoja plana, alta
        relación superficie/volumen), composición aproximada similar,
        rango de humedad inicial similar.

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
        T_K: null
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: ESTIMADA_POR_ANALOGIA
      fuente: "PENDIENTE — copiar de perejil una vez que perejil esté poblado"
      notas: |
        ESTIMADA_POR_ANALOGIA. Copiar params de perejil.midilli cuando estén disponibles.

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: ESTIMADA_POR_ANALOGIA
      fuente: "PENDIENTE — analogía con perejil"
      notas: null

  notas: |
    PRODUCTO CON DATOS DE ANALOGÍA. Ver decisión Sesión 6.
    Todos los parámetros de capa fina e isoterma se estiman por
    analogía con perejil. Calidad máxima posible: ESTIMADA_POR_ANALOGIA.
    Si se realizan ensayos de cinética de apio (tesis, trabajos de
    grado, papers futuros), actualizar con datos reales.


