# PAPA
# =============================================================================
papa:
  descripcion: "Papa (Solanum tuberosum) en rodajas o cubos. Producto de alta disponibilidad en NOA (Puna). Relativamente alta densidad y baja humedad inicial comparado a otras hortalizas (~80% bh). Encogimiento significativo durante secado."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: false

  propiedades_basicas:
    densidad_aparente: 1050.0       # kg/m³. ASHRAE Ch.19.
    calor_especifico_seco: 1550.0   # J/(kg·K). Choi-Okos con composición papa cruda.
    humedad_inicial_tipica: 4.0     # kg/kg ms — ~80% bh. Rango: 3.5-4.5.
    humedad_equilibrio_aire_seco: 0.09
    calidad_propiedades_basicas: MEDIA
    fuente_propiedades_basicas: |
      Densidad: ASHRAE Handbook Refrig. 2018 Ch.19.
      Cp, X0: USDA SR-28 + Choi-Okos.

  capa_fina:
    page:
      params:
        k: null
        n: null
      condiciones_calibracion:
        T_K: null         # esperado: 333-353 K (60-80°C). Paper ref: Akpinar et al. (2003)
        v_aire_m_s: null
        espesor_m: null
        HR_aire: null
      calidad_datos: null
      fuente: "PENDIENTE — Akpinar EK, Midilli A, Bicer Y (2003). Energy Convers Manag 44(10):1689-1705. DOI:10.1016/S0196-8904(02)00171-1"
      notas: null

    midilli:
      params:
        a: null
        k: null
        n: null
        b: null
      condiciones_calibracion:
