# =============================================================================
# AJÍ ROJO (RED CHILLIES) — distinto de pimiento_rojo
# =============================================================================
aji_rojo:
  descripcion: "Ají rojo (Capsicum spp., chillies) — frutos enteros, pungentes por capsaicina, color rojo por carotenoides (capsantina). DISTINTO de pimiento_rojo (bell pepper grande dulce): el ají rojo es pequeño (~4 cm de largo), pungente, y se seca ENTERO (no rebanado). Producción NOA importante para condimento y exportación. Paper de referencia: variedad polyster (Coimbatore, India)."
  descripcion_en: "Red chili (Capsicum spp., chillies) — whole fruits, pungent from capsaicin, red from carotenoids (capsanthin). DIFFERENT from pimiento_rojo (large sweet bell pepper): the red chili is small (~4 cm long), pungent, and dried WHOLE (not sliced). Significant NOA production for seasoning and export. Reference paper: polyster variety (Coimbatore, India)."
  descripcion_pt: "Pimenta vermelha (Capsicum spp., chillies) — frutos inteiros, picantes por capsaicina, cor vermelha por carotenoides (capsantina). DIFERENTE de pimiento_rojo (pimentão grande doce): a pimenta vermelha é pequena (~4 cm de comprimento), picante, e seca-se INTEIRA (não fatiada). Produção relevante no NOA para condimento e exportação. Artigo de referência: variedade polyster (Coimbatore, Índia)."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: true   # capsaicina y carotenoides se degradan con calor >60°C y UV

  propiedades_basicas:
    densidad_aparente: 800.0        # kg/m³. Estimación (frutos huecos con semillas).
    calor_especifico_seco: 1500.0   # J/(kg·K). Estimación Choi-Okos.
    humedad_inicial_tipica: 3.25    # kg/kg ms — 325% bs (Kaleemullah 2006).
    humedad_equilibrio_aire_seco: 0.105
    calidad_propiedades_basicas: BAJA
    fuente_propiedades_basicas: |
      Humedad inicial y final: Kaleemullah & Kailappan (2006)
        DOI:10.1016/j.jfoodeng.2005.05.049 (variedad polyster, Coimbatore, India).
      Densidad y Cp: estimaciones genéricas. Calidad BAJA.

  forma_geometrica:
    diametro_eq_m: 0.012        # chile entero ~10–15 mm de diámetro
    porosidad_lecho: 0.55        # frutos huecos largos → mucho hueco entre ellos
    esfericidad: 0.5              # forma alargada irregular
    forma: "chiles enteros (no rebanados)"

  capa_fina:
    page:
      params:
        # k convertido de h⁻ᴺ (paper) a min⁻ᴺ (convención del catálogo):
        # k_min = k_h / 60^N
        sets_por_temperatura:
          - {T_K: 323.15, k: 0.000696, n: 1.1954, R2: 0.997}   # 50 °C
          - {T_K: 328.15, k: 0.001277, n: 1.1537, R2: 0.995}   # 55 °C
          - {T_K: 333.15, k: 0.001832, n: 1.1550, R2: 0.992}   # 60 °C
          - {T_K: 338.15, k: 0.002694, n: 1.1302, R2: 0.997}   # 65 °C
        # Default top-level: T=55°C (RECOMENDADO POR EL PAPER — mejor balance
        # entre tiempo de secado, retención de capsaicina y color rojo a*).
        k: 0.001277
        n: 1.1537
      condiciones_calibracion:
        T_K: [323.15, 328.15, 333.15, 338.15]   # 50, 55, 60, 65 °C
        v_aire_m_s: 0.4
        espesor_m: 0.016        # capa de ~1.6 cm, frutos enteros apilados
        HR_aire: null
        forma: "frutos enteros (no rebanados); dimensiones individuales 4.0 × 1.6 × 1.6 cm"
      calidad_datos: ALTA
      fuente: "Kaleemullah S, Kailappan R (2006). Modelling of thin-layer drying kinetics of red chillies. J Food Eng 76(4):531-537. DOI:10.1016/j.jfoodeng.2005.05.049. Tabla 5 (4 T: 50-65°C). Page rankeado #1 entre Lewis/Hustrulid-Flikke/Page/Kaleemullah."
      notas: |
        DEFAULT a T=55°C — RECOMENDADO EXPLÍCITAMENTE POR EL PAPER (Tabla 4):
        a 55°C la capsaicina se mantiene en 0.57% y el color rojo a*=23.03;
        a 65°C bajan a 0.34% y a*=14.73 (degradación severa).
        Variedad polyster (Coimbatore local, India), frutos enteros sin
        rebanar ni pretratamiento.

        IMPORTANTE — CONVERSIÓN DE UNIDADES:
        El paper reporta k en h⁻ᴺ con θ en horas (verificado: Lewis K=0.1443 h⁻¹
        a 50°C, θ=26h → MR=0.024, consistente con M_final=10.5%).
        El catálogo usa min⁻ᴺ con t en min. Conversión aplicada: k_min = k_h / 60^N.
        Valores originales del paper (h⁻ᴺ):
          T=50°C: k=0.07906, T=55°C: 0.12563, T=60°C: 0.18114, T=65°C: 0.23631.

        DATOS ADICIONALES del paper (no usados por el motor actual):
          - Ea = 37.76 kJ/mol (Arrhenius de D_eff vs 1/T, R²=0.99)
          - D_0 = 4.92 × 10⁻³ m²/s
          - D_eff: 3.78 × 10⁻⁹ (50°C) a 7.10 × 10⁻⁹ m²/s (65°C)
          - Modelo Kaleemullah (T-dependent): MR = exp(-(at+b)·θ^(ct+d))
            con a=0.00848, b=-0.34775, c=0.00005, d=1.1912 (rank #2 del paper).

  isoterma:
    gab:
      params:
        X_m: null
        C: null
        K: null
      rango_T_K: null
      calidad_datos: null
      fuente: "PENDIENTE — Kaleemullah & Kailappan (2004). Moisture sorption isotherms of red chillies. Biosyst Eng 88(1):95-104. Los mismos autores publicaron isotermas de chillies; no descargado todavía."
      notas: null

  notas: |
    PRODUCTO NUEVO en el catálogo (cargado en esta sesión).
    DIFERENCIADO de pimiento_rojo (mismo género Capsicum, productos distintos):
      - aji_rojo:     chillies pequeños pungentes, frutos enteros, capsaicina alta.
      - pimiento_rojo: bell pepper grande dulce, en rodajas o cubos, sin capsaicina.

    Papers cargados:
      - Kaleemullah S, Kailappan R (2006). J Food Eng 76(4):531-537.
        DOI:10.1016/j.jfoodeng.2005.05.049 [PDF en docs/notas/papers]
        → capa_fina.page (4 T: 50-65°C, calidad ALTA).
    Papers pendientes:
      - Kaleemullah & Kailappan (2004). Biosyst Eng 88(1):95-104 — isoterma GAB
        de red chillies. No descargado.

    T MÁXIMA RECOMENDADA: 55 °C (>60°C degrada capsaicina y color rojo).
    fotosensible: true — cámara preferentemente protegida de luz directa.
