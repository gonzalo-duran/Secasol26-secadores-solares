  descripcion_pt: "Salsa (Petroselinum crispum), folhas frescas. Alta relação superfície/volume por sua estrutura laminar. Produto aromático — temperatura máxima ~50°C para preservar óleos essenciais. Secagem relativamente rápida."
  categoria: HORTALIZA
  tipo_secado: CAPA_FINA
  fotosensible: true   # aceites esenciales (apiol, mirceno) sensibles a UV

